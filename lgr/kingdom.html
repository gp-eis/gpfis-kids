    const P = parts(w), toys = {}, order = TOYS.map(t => t[0]);

    TOYS.forEach(([id, en, ko, x, y, wd]) => { const b = toys[id] = thing('toy-' + (id === 'sheet' ? 'speak' : id), x, y, wd, '', '<span class="sign">' + en + '<small>' + ko + '</small></span>' + (P[id] ? '<span class="tick">' + STAR + '</span>' : '')); b.id2 = id; if (id === 'sheet') b.querySelector('.in').style.marginLeft = (wd * .158) + 'px'; });   // the microphone leans right: its BASE, not its middle, goes on the middle of the stand
    const mark = () => { world.querySelectorAll('.mk').forEach(m => m.remove()); const n = next(); if (n) toys[n].insertAdjacentHTML('beforeend', '<i class="mk"></i>'); };
    // the workbench: one ruby star for each finished toy
    order.forEach((id, i) => { if (P[id]) world.insertAdjacentHTML('beforeend', '<div class="slot" data-slot="' + i + '" style="left:' + SLOTS[i][0] + 'px;top:' + SLOTS[i][1] + 'px">' + STAR + '</div>'); });
    pen = person('penny', 300); ger = person('gerry', 314);
    const home = [900, 800], stand = b => [b.x + (b.x < 836 ? 1 : -1) * (b.w * .5 + 95), Math.max(b.y + 170, 770)];
    async function give(id) {                          // a finished toy sends a ruby star to the workbench
      const b = toys[id], i = order.indexOf(id); setPart(w, id); b.insertAdjacentHTML('beforeend', '<span class="tick">' + STAR + '</span>'); again(b, 'squash'); snd.ding(); sparks(b.x, b.y - b.w * .6, 18, 150);
      const f = document.createElement('div'); f.className = 'fly'; f.innerHTML = STAR; f.style.left = b.x + 'px'; f.style.top = (b.y - b.w * .6) + 'px'; world.appendChild(f);
      const dx = SLOTS[i][0] - b.x, dy = SLOTS[i][1] - (b.y - b.w * .6);
      await Promise.race([f.animate([{ transform: 'translate(0,0) scale(.3) rotate(0)' }, { transform: 'translate(' + dx * .5 + 'px,' + (dy - 160) + 'px) scale(1.6) rotate(200deg)', offset: .55 }, { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(1) rotate(360deg)' }], { duration: 900, easing: 'ease-in-out', fill: 'forwards' }).finished, wait(1200)]);
      f.remove(); world.insertAdjacentHTML('beforeend', '<div class="slot in" data-slot="' + i + '" style="left:' + SLOTS[i][0] + 'px;top:' + SLOTS[i][1] + 'px">' + STAR + '</div>'); snd.pop(); sparks(SLOTS[i][0], SLOTS[i][1], 12, 90);
      mark(); if (!next()) { await wait(500); finish(); }
    }
    async function finish() {                          // four stars become the week's treasure, then back out through the chest
      busy = true; await both(900, 720); snd.whoosh();
      const stars = [...world.querySelectorAll('.slot')];
      await Promise.all(stars.map(s => Promise.race([s.animate([{ transform: 'translate(0,0)' }, { transform: 'translate(' + (864 - parseFloat(s.style.left)) + 'px,' + (300 - parseFloat(s.style.top)) + 'px) scale(.4) rotate(360deg)' }], { duration: 700, easing: 'ease-in', fill: 'forwards' }).finished, wait(900)])));
      stars.forEach(s => s.remove()); sparks(864, 300, 40, 260); snd.big();
      const t = thing('t' + w, 864, 470, 210, 'noshadow pop'); t.style.zIndex = 900; toast('You made the ' + WEEKS[w][1] + '!', '보물 완성!'); pen.pose(5); ger.pose(5);
      await wait(1900); setDone(w); await pen.dive(864, 120); await ger.dive(864, 120);
      flash(() => { sessionStorage.setItem('lgr2.arrive', 'built' + w); location.hash = '#/cave'; });
    }
    Object.values(toys).forEach(b => b.onclick = async () => {
      if (busy) return; busy = true; snd.pop(); const id = b.id2, [sx, sy] = stand(b);
      await both(sx, sy, b.x < 836 ? -105 : 105); again(b, 'squash'); snd.boing(); await wait(380); busy = false;
      if (parts(w)[id]) sparks(b.x, b.y - b.w * .6, 10, 100);
      if (id === 'watch') return play('videos/A-1-w' + w + '-essay.mp4', () => { if (!parts(w).watch) give('watch'); });
      if (id === 'abc') { sessionStorage.setItem('lgr2.abc', w); return flash(() => { location.href = 'book/index.html?set=a&back=' + encodeURIComponent('../kingdom.html#/w/' + w); }); }
      // Sheet and Dictation are not made yet: in this sample they give their star straight away so the whole trip can be tried
      // Sheet = the question part of the printed worksheet, online, with the speaking step (app/sheet)
      if (id === 'sheet') { sessionStorage.setItem('lgr2.sheet', w); return flash(() => { location.href = 'sheet/index.html?w=' + w + '&back=' + encodeURIComponent('../kingdom.html#/w/' + w); }); }
      // Dictation = hear it from the horn, build it with tiles, then write it by hand (app/dictation)
      if (id === 'dictation') { sessionStorage.setItem('lgr2.dict', w); return flash(() => { location.href = 'dictation/index.html?w=' + w + '&back=' + encodeURIComponent('../kingdom.html#/w/' + w); }); }
      toast(TOYS.find(t => t[0] === id)[1] + ': coming soon!', '샘플: 별만 받아요'); if (!parts(w)[id]) { await wait(500); give(id); }
    });
    $('#back').onclick = async () => { if (busy) return; busy = true; snd.pop(); await pen.dive(864, 120); await ger.dive(864, 120); flash(() => { sessionStorage.setItem('lgr2.arrive', ''); location.hash = '#/cave'; }); };
    // arriving: they drop in from above, out of the light
    pen.put(home[0], home[1]); ger.put(home[0] - 125, home[1] - 12); pen.el.classList.add('gone'); ger.el.classList.add('gone');
    await wait(350); await pen.land(864, 120); await ger.land(864, 120); mark(); busy = false;
    // back from a reading book: Alphabet Reading counts once a book has been read
    // back from the online worksheet: the Sheet star comes once one of this week's worksheets is finished
    // back from Dictation: its star comes once one of this week's dictations is finished
    if (sessionStorage.getItem('lgr2.dict') == w) { sessionStorage.removeItem('lgr2.dict'); let got = []; try { got = JSON.parse(localStorage.getItem('lgr.dictations') || '[]'); } catch (e) {}
      if (got.some(id => id[0] === 'abcd'[w - 1]) && !parts(w).dictation) give('dictation'); else if (!parts(w).dictation) toast('Finish one dictation to get the star!', '받아쓰기를 하나 끝내요'); }
    if (sessionStorage.getItem('lgr2.sheet') == w) { sessionStorage.removeItem('lgr2.sheet'); let got = []; try { got = JSON.parse(localStorage.getItem('lgr.sheets') || '[]'); } catch (e) {}
      if (got.some(id => id[0] === 'abcd'[w - 1]) && !parts(w).sheet) give('sheet'); else if (!parts(w).sheet) toast('Finish one Speak reading to get the star!', '말하기를 하나 끝내요'); }
    if (sessionStorage.getItem('lgr2.abc') == w) { sessionStorage.removeItem('lgr2.abc'); let n = 0; try { n = JSON.parse(localStorage.getItem('lgr.pages') || '[]').length; } catch (e) {}
      if (n > 0 && !parts(w).abc) give('abc'); else if (!n) toast('Read one book to get the star!', '책을 한 권 읽어요'); }
    else if (!next() && !weekDone(w)) finish();
  }

  // ---- video: the real file when it is there ----
  let afterV = null;
  function play(src, after) { afterV = after; $('#vbody').innerHTML = ''; $('#player').hidden = false;
    fetch(src, { method: 'HEAD' }).then(r => r.ok && /video/.test(r.headers.get('content-type') || '')).catch(() => false).then(ok => { $('#vbody').innerHTML = ok ? '<video controls autoplay playsinline src="' + src + '"></video>' : '<p>Daily Essay video<br>coming soon!</p>'; }); }
  $('#closeV').onclick = () => { $('#player').hidden = true; $('#vbody').innerHTML = ''; snd.pop(); const a = afterV; afterV = null; if (a) a(); };

  function route() {
    document.body.classList.remove('front');
    const m = location.hash.match(/^#\/w\/([1-4])$/);
    if (m && +m[1] <= current() ) return cabin(+m[1]);
    if (m && weekDone(+m[1])) return cabin(+m[1]);
    if (location.hash === '#/cave') { let a = 'gate'; try { const v = sessionStorage.getItem('lgr2.arrive'); if (v !== null) { a = v; sessionStorage.removeItem('lgr2.arrive'); } } catch (e) {} return cave(a); }
    if (location.hash === '#/ruby') return valley();
    kingdom();
  }
  addEventListener('hashchange', route); route();
})();
</script><script src="../ext/home.js?v=mwu5ds19" data-home="../demo/street.html"></script></body></html>
