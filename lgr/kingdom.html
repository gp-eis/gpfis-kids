<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Fredoka:wght@500;600;700&family=Noto+Sans+KR:wght@500;700&display=swap">
<style>
/* THE REDESIGN SLICE (REDESIGN.md, 20 Nov 2026): Ruby 1 only. "The chest is the door."
   cave (four chests = four weeks) -> tap this week's chest -> Penny and Gerry jump in -> the ruby cabin, where the
   four activities are toys in the room -> each finished toy puts a ruby star on the workbench -> four stars make the
   week's treasure -> back out, the chest becomes the treasure, the next chest unlocks. No pop-up menu anywhere.
   Everything lives in one 1672 x 941 "world" box that is scaled to cover the window, so every thing stays locked to
   its place on the painting. Paintings have no people and no pressable things in them: those are separate cut-outs.
   The old build is untouched in index.html. Progress is kept on this device only (localStorage "lgr2"). */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#2a0d0a;font-family:"Fredoka","Noto Sans KR",sans-serif;user-select:none}
#view{position:fixed;inset:0;overflow:hidden}
#world{position:absolute;left:0;top:0;width:1672px;height:941px;transform-origin:0 0}
#bg{position:absolute;inset:0;width:100%;height:100%;display:block}
#dim{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 60%,transparent 40%,rgba(30,4,4,.38) 100%);z-index:2000}
/* things */
.th{position:absolute;left:0;top:0;width:0;height:0;border:0;background:none;cursor:pointer;font:inherit}
.th .in{position:absolute;left:0;bottom:0;transform:translateX(-50%);transform-origin:50% 100%;display:block}
.th img.im{display:block;width:100%;pointer-events:none;filter:drop-shadow(0 0 14px rgba(255,90,60,.28))}
.th::before{content:"";position:absolute;left:calc(var(--w) * -.56);width:calc(var(--w) * 1.12);top:calc(var(--w) * -.11);height:calc(var(--w) * .22);border-radius:50%;background:radial-gradient(closest-side,rgba(40,6,4,.7),rgba(40,6,4,.3) 55%,transparent)}
.th.noshadow::before{display:none}
/* a treasure on its plot: a tight dark shadow exactly where its base meets the stone, so it looks planted, not hovering */
.th.tre::before{display:none}
.th.tre::after{content:"";position:absolute;left:calc(var(--bw) * -.56);width:calc(var(--bw) * 1.12);top:calc(var(--bw) * -.2);height:calc(var(--bw) * .3);border-radius:50%;background:radial-gradient(closest-side,rgba(34,6,2,.82),rgba(34,6,2,.5) 55%,rgba(34,6,2,.18) 80%,transparent);z-index:-1;pointer-events:none}
.th .in{animation:breathe 3.2s ease-in-out infinite;animation-delay:var(--dl,0s)}
@keyframes breathe{50%{transform:translateX(-50%) scale(1.025,.975)}}
.th:hover .in{animation:wob .55s ease-in-out infinite}
@keyframes wob{0%,100%{transform:translateX(-50%) rotate(-2.5deg) scale(1.05)}50%{transform:translateX(-50%) rotate(2.5deg) scale(1.05)}}
.th.squash .in{animation:squash .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes squash{0%{transform:translateX(-50%) scale(1)}30%{transform:translateX(-50%) scale(1.22,.72)}60%{transform:translateX(-50%) scale(.9,1.14)}100%{transform:translateX(-50%) scale(1)}}
.th.shake .in{animation:shake .5s}
@keyframes shake{0%,100%{transform:translateX(-50%)}20%{transform:translateX(-56%) rotate(-4deg)}40%{transform:translateX(-44%) rotate(4deg)}60%{transform:translateX(-54%) rotate(-3deg)}80%{transform:translateX(-47%) rotate(2deg)}}
.th.rattle .in{animation:rattle .9s}
@keyframes rattle{0%,100%{transform:translateX(-50%)}10%,50%,90%{transform:translateX(-50%) rotate(-5deg) scale(1.06)}30%,70%{transform:translateX(-50%) rotate(5deg) scale(1.06)}}
.th.pop .in{animation:pop .7s cubic-bezier(.2,1.7,.4,1)}
@keyframes pop{0%{transform:translateX(-50%) scale(0)}100%{transform:translateX(-50%) scale(1)}}
.th.locked img.im{filter:grayscale(.75) brightness(.55)}
.th.locked{cursor:default}
.lock{position:absolute;left:0;bottom:calc(var(--w) * .26);transform:translateX(-50%);width:calc(var(--w) * .26);pointer-events:none}
.sbook.shut .im{filter:grayscale(.55) brightness(.8)}.sbook .sign{font-size:20px}
.mk{position:absolute;left:0;bottom:calc(var(--w) * .95);width:0;height:0;pointer-events:none;animation:bob .8s ease-in-out infinite}
.mk::after{content:"";position:absolute;left:-26px;top:-40px;border:26px solid transparent;border-top:36px solid #ffd23f;filter:drop-shadow(0 4px 0 #b9820f) drop-shadow(0 6px 6px rgba(0,0,0,.4))}
@keyframes bob{50%{translate:0 -16px}}
/* a finished toy wears a gold medal with the ruby star it earned (user, 21 Nov: the flat green tick looked like a web
   button, not part of the room): gold disc, darker rim, two ribbon tails, a slow glint */
.tick{position:absolute;left:calc(var(--w) * .34);bottom:calc(var(--w) * .8);width:62px;height:62px;margin-left:-31px;border-radius:50%;pointer-events:none;rotate:-9deg;
  background:radial-gradient(circle at 35% 28%,#fff6c4 0,#ffd94a 38%,#f0ab19 72%,#c98209 100%);box-shadow:inset 0 0 0 4px #b97a0c,inset 0 0 0 7px #ffe98a,0 5px 0 #8a5606,0 9px 12px rgba(40,10,2,.5);
  display:grid;place-items:center;animation:pop2 .5s cubic-bezier(.2,1.7,.4,1)}
.tick svg{width:70%;height:70%;filter:drop-shadow(0 2px 0 rgba(120,10,20,.55))}
.tick::before,.tick::after{content:"";position:absolute;top:78%;width:17px;height:30px;background:linear-gradient(#e23b4a,#b3202c);clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%);z-index:-1}
.tick::before{left:11px;rotate:14deg}.tick::after{right:11px;rotate:-14deg}
@keyframes pop2{0%{scale:0}}
.sign{position:absolute;left:0;top:6px;transform:translateX(-50%);background:linear-gradient(#f6d39a,#e0a660 60%,#cf8f48);border-radius:12px;padding:1px 16px 3px;font:800 24px/1.05 "Baloo 2";color:#4a2508;text-align:center;box-shadow:inset 0 2px 0 rgba(255,240,210,.6),0 4px 0 #9a5c26,0 8px 10px rgba(30,8,4,.45);white-space:nowrap;pointer-events:none}
.sign small{display:block;font:500 13px "Noto Sans KR";opacity:.85}
/* the portal in the open chest */
.portal{position:absolute;left:0;bottom:calc(var(--w) * .34);width:calc(var(--w) * .9);height:calc(var(--w) * .95);transform:translateX(-50%);pointer-events:none;border-radius:50% 50% 46% 46%;overflow:hidden;-webkit-mask:radial-gradient(ellipse at 50% 62%,#000 45%,transparent 72%);mask:radial-gradient(ellipse at 50% 62%,#000 45%,transparent 72%);animation:rise .6s ease-out}
.portal::before{content:"";position:absolute;inset:-30%;background:conic-gradient(from 0deg,#fff6fb,#ff5fa2,#ffd86b,#fff,#ff3d6e,#ffb3d1,#fff6fb);animation:spin 1.6s linear infinite;filter:blur(6px)}
.portal::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 62%,#fff 0,rgba(255,255,255,.75) 14%,transparent 46%)}
@keyframes spin{to{rotate:360deg}}
@keyframes rise{0%{scale:.2;opacity:0}}
/* Penny and Gerry: whole-body pose pictures, switched while they walk */
.ch{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none}
.ch::before{content:"";position:absolute;left:calc(var(--h) * -.25);width:calc(var(--h) * .5);top:calc(var(--h) * -.05);height:calc(var(--h) * .1);border-radius:50%;background:radial-gradient(closest-side,rgba(40,6,4,.65),transparent)}
.ch .b{position:absolute;left:0;bottom:0;width:0;height:0}
.ch img{position:absolute;left:0;bottom:0;height:var(--h);transform:translateX(-50%) scaleX(var(--dir,1));filter:drop-shadow(0 0 10px rgba(255,170,120,.35)) saturate(1.05)}
.ch.idle img{animation:idle 2.6s ease-in-out infinite}
@keyframes idle{50%{transform:translateX(-50%) scaleX(var(--dir,1)) scaleY(1.02)}}
.ch.gone{opacity:0}
/* light over the cut-outs so they take the scene's colour */
#glow{position:absolute;inset:0;pointer-events:none;z-index:1999;background:linear-gradient(180deg,rgba(255,150,90,.10),rgba(255,60,40,.12));mix-blend-mode:soft-light}
/* the valley: asleep (dull) until reading wakes it, place by place */
#dull{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;filter:grayscale(.5) brightness(.78);z-index:1}
.cart{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none}
.cart::before{content:"";position:absolute;left:calc(var(--w) * -.55);width:calc(var(--w) * 1.1);top:calc(var(--w) * -.1);height:calc(var(--w) * .2);border-radius:50%;background:radial-gradient(closest-side,rgba(40,10,4,.6),transparent)}
.cart .k{position:absolute;left:0;bottom:0;width:var(--w);margin-left:calc(var(--w) * -.5);transform-origin:50% 100%}
.cart .k>img.c{display:block;width:100%}
.cart .k>img.f{position:absolute;left:0;top:0;width:100%;clip-path:polygon(0 17%,31% 35%,100% 21%,100% 100%,0 100%)}
.cart .k>img.r{position:absolute;bottom:50%;height:78%;transform:translateX(-50%);transform-origin:50% 100%;animation:sway 2.6s ease-in-out infinite}
.cart .k>img.r.p{animation-duration:2.1s;animation-delay:-.7s}
@keyframes sway{0%,100%{rotate:-2.5deg}50%{rotate:2.5deg;translate:0 -2px}}
.cart.roll .k{animation:rattle2 .22s linear infinite}
@keyframes rattle2{50%{translate:0 -3px}}
.cart.roll .k>img.r{animation:ride .44s ease-in-out infinite}
.cart.roll .k>img.r.p{animation-delay:-.22s}
@keyframes ride{0%,100%{rotate:3deg}50%{translate:0 -6px;rotate:-4deg}}
.place{position:absolute;left:0;top:0;width:0;height:0;border:0;background:none;cursor:pointer;font:inherit}
.place .hit{position:absolute;left:-95px;top:-40px;width:190px;height:170px;border-radius:50%}
.place .bd{position:absolute;left:0;top:0;translate:-50% -50%;min-width:64px;height:64px;padding:0 14px;border-radius:999px;background:linear-gradient(#fff6d8,#ffd23f);border:5px solid #4a2508;display:grid;place-items:center;font:800 32px "Baloo 2";color:#4a2508;box-shadow:0 6px 0 #9a5c26,0 10px 12px rgba(0,0,0,.45);white-space:nowrap;animation:breathe2 2.4s ease-in-out infinite}
@keyframes breathe2{50%{scale:1.07}}
.place:hover .bd{animation:wob2 .5s ease-in-out infinite}
@keyframes wob2{0%,100%{rotate:-6deg;scale:1.12}50%{rotate:6deg;scale:1.12}}
.place.locked .bd{background:linear-gradient(#b9aaa2,#8a7a74);border-color:#3d2a22;animation:none;min-width:50px;height:50px}
.place.shake .bd{animation:shake2 .5s}
@keyframes shake2{20%{translate:-62% -50%;rotate:-8deg}40%{translate:-38% -50%;rotate:8deg}60%{translate:-56% -50%}80%{translate:-45% -50%}}
.place .nm{position:absolute;left:0;top:40px;transform:translateX(-50%);background:linear-gradient(#f6d39a,#e0a660 60%,#cf8f48);border-radius:12px;padding:1px 14px 3px;font:800 22px/1.05 "Baloo 2";color:#4a2508;box-shadow:inset 0 2px 0 rgba(255,240,210,.6),0 4px 0 #9a5c26,0 8px 10px rgba(30,8,4,.45);white-space:nowrap;pointer-events:none}
.place .mk{bottom:44px}
.cart.gold .k>img.f{clip-path:polygon(0 19%,68% 31%,100% 12%,100% 100%,0 100%)}
.cart.gold .k>img.r{bottom:52%;height:76%}
/* the front map: the four gem lands */
.land{position:absolute;left:0;top:0;width:0;height:0;border:0;background:none;cursor:pointer;font:inherit}
.land .hit{position:absolute;border-radius:30%}
.land .sg{position:absolute;left:0;top:0;translate:-50% 0;display:block;border-radius:18px;padding:2px 20px 5px;font:800 28px/1.05 "Baloo 2";color:#fff;white-space:nowrap;border:4px solid #fff;box-shadow:0 6px 0 rgba(0,0,0,.35),0 12px 14px rgba(0,0,0,.4);animation:breathe2 2.4s ease-in-out infinite}
.land .sg small{display:block;font:600 13px "Noto Sans KR";opacity:.95}
.land:hover .sg{animation:wob2 .5s ease-in-out infinite}
.land.locked .sg{animation:none}
.land.shake .sg{animation:shake3 .5s}
@keyframes shake3{20%{translate:-56% 0;rotate:-5deg}40%{translate:-44% 0;rotate:5deg}60%{translate:-54% 0}80%{translate:-47% 0}}
.land .lk{position:absolute;left:0;top:-34px;translate:-50% 0;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:#3d2a22;border:4px solid #f3e7dc;box-shadow:0 5px 8px rgba(0,0,0,.45);z-index:1}
.land .mk{bottom:8px}
.land .st{position:absolute;left:0;top:-58px;translate:-50% 0;font:800 46px "Baloo 2";color:#ffd23f;text-shadow:0 3px 0 #9a5c26,0 0 14px #fff6c0}
.front #title{margin:0 auto 0 0;font-size:22px;padding:3px 20px 5px;border-radius:14px}
.front #title small{font-size:12px}
/* stars on the workbench */
.slot{position:absolute;width:78px;height:78px;margin:-39px;pointer-events:none;z-index:400}
.slot svg,.fly svg{width:100%;height:100%;filter:drop-shadow(0 0 10px #ffe36a) drop-shadow(0 3px 0 #b3202c)}
.slot.in{animation:pop2 .5s cubic-bezier(.2,1.7,.4,1)}
.fly{position:absolute;width:78px;height:78px;margin:-39px;pointer-events:none;z-index:3000}
.spark{position:absolute;width:16px;height:16px;margin:-8px;pointer-events:none;z-index:3001;background:#ffe36a;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
#flash{position:fixed;inset:0;background:radial-gradient(circle,#fff 0,#ffd3e6 45%,#ff5f8f 100%);opacity:0;pointer-events:none;z-index:50}
/* the few buttons */
#hud{position:fixed;left:0;right:0;top:0;padding:14px 18px;display:flex;gap:12px;align-items:center;z-index:20;pointer-events:none}
#hud>*{pointer-events:auto}
/* THE MONTH'S SPEAKING BOOK: the real worksheet cover stands in the corner of the Ruby Cave, a dot for each finished
   week, grey until Speak has kept a line. Pressing it opens app/speakbook/?month=1 (every week in one book). */
#mbk{position:fixed;right:26px;bottom:52px;width:clamp(96px,9.5vw,150px);border:0;background:none;padding:0;cursor:pointer;z-index:19;rotate:4deg;display:none;transition:transform .15s}
body.incave #mbk{display:block}
#mbk:hover{transform:translateY(-6px) rotate(-3deg) scale(1.05)}
#mbk img{width:100%;display:block;border-radius:4px 10px 10px 4px;box-shadow:-6px 0 0 #7d1820,0 10px 14px rgba(0,0,0,.5),0 0 0 3px #fff}
#mbk b{position:absolute;left:50%;bottom:-12px;translate:-50% 0;background:#e23b4a;color:#fff;border-radius:999px;padding:3px 14px;font:800 clamp(12px,1.05vw,16px) "Baloo 2";white-space:nowrap;box-shadow:0 4px 0 #9c1f2c}
#mbk .dots{position:absolute;left:50%;bottom:-38px;translate:-50% 0;display:flex;gap:6px}
#mbk .dots i{width:15px;height:15px;border-radius:50%;background:#d9cfc2;box-shadow:0 0 0 2px #fff}#mbk .dots i.on{background:#ffd23f}
#mbk.shut img{filter:grayscale(.7) brightness(.8)}
#mbk.wob{animation:mwob .5s}@keyframes mwob{25%{rotate:-4deg}50%{rotate:10deg}75%{rotate:0deg}}
/* THE WEEK'S CABIN as five tiles on a faded backdrop (user's sketch, 24 Nov 2026) */
body.soft{background:#fff3e2}body.soft #bg{opacity:.34;filter:blur(3px) saturate(.9)}body.soft #dim,body.soft #glow{display:none}
#cab{position:fixed;left:50%;top:50%;width:1280px;height:720px;transform-origin:0 0;z-index:15;font-family:"Fredoka","Noto Sans KR",sans-serif}
#cab .tl{position:absolute;border:0;background:#fff;border-radius:34px;box-shadow:0 10px 0 #e6cfa4,0 22px 26px rgba(90,30,10,.28);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;font:inherit;padding:0;
  animation:tlin .55s cubic-bezier(.2,1.5,.4,1) backwards;animation-delay:calc(var(--k) * .08s);transition:translate .15s,rotate .15s}
@keyframes tlin{0%{opacity:0;transform:translateY(30px) scale(.85)}}
#cab .tl:hover{translate:0 -6px;rotate:-1deg}#cab .tl:active{translate:0 6px;box-shadow:0 4px 0 #e6cfa4,0 10px 14px rgba(90,30,10,.28)}
#cab .tl.sq{animation:tlsq .45s}@keyframes tlsq{30%{transform:scale(1.07,.92)}60%{transform:scale(.96,1.05)}}

@keyframes tlbob{50%{translate:0 -6px;rotate:1.5deg}}
#cab .tl b{font:800 30px/1 "Baloo 2";color:#4a2508}#cab .tl small{font:600 16px "Noto Sans KR";color:#8a7d6c}
#cab .tl.big b{font-size:44px}#cab .tl.big small{font-size:20px}

#cab .tl .tk{position:absolute;right:-12px;top:-14px;width:64px;height:64px;rotate:10deg;filter:drop-shadow(0 4px 4px rgba(0,0,0,.3));animation:pop .4s cubic-bezier(.2,1.6,.4,1)}#cab .tk svg{width:100%;height:100%}
#cab .tl .pg{position:absolute;right:12px;top:12px;background:#efe6da;color:#8a7d6c;border-radius:999px;padding:2px 12px;font:800 17px/1.2 "Baloo 2";font-style:normal}
#cab .tl .pg.some{background:#ffd23f;color:#5a3a00}

#cab .tl.next::before{content:"";position:absolute;left:50%;top:-46px;margin-left:-18px;border:18px solid transparent;border-top:26px solid #ffc93c;border-bottom:0;filter:drop-shadow(0 4px 2px rgba(0,0,0,.25));animation:bob .8s ease-in-out infinite}
#cab .tl.shut{background:#efe6da}#cab .tl.shut img{filter:grayscale(.8) opacity(.6);animation:none}#cab .tl.shut b{color:#a8977e}

#cab .sl{width:36px;height:36px;display:block;filter:grayscale(1) opacity(.28);transition:filter .3s}#cab .sl svg{width:100%;height:100%;display:block}
#cab .sl.on{filter:none}#cab .sl.in{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
#cab .hp{position:absolute;bottom:46px;height:236px;filter:drop-shadow(0 8px 8px rgba(0,0,0,.3));pointer-events:none;animation:tlin .6s .3s backwards}
#cab #hg{right:104px}#cab #hpn{right:6px}
#cab .hb{position:absolute;right:16px;bottom:292px;max-width:240px;background:#fff;border:3px solid #f0ab19;border-radius:20px;padding:8px 18px;font:700 20px/1.2 "Fredoka";text-align:center;opacity:0;scale:.8;transition:opacity .25s,scale .25s cubic-bezier(.2,1.6,.4,1);transform-origin:80% 100%}

#cab .won img{width:300px;opacity:0;scale:.2;filter:drop-shadow(0 0 40px #ffe36a) drop-shadow(0 16px 14px rgba(0,0,0,.4));transition:opacity .3s,scale .6s cubic-bezier(.2,1.6,.4,1)}
#cab .won.on{background:radial-gradient(circle,rgba(255,240,180,.75),rgba(60,14,10,.55))}#cab .won.on img{opacity:1;scale:1}
.cfly{position:fixed;width:84px;height:84px;pointer-events:none;z-index:60}.cfly svg{width:100%;height:100%}
.cspark{position:fixed;width:12px;height:12px;border-radius:3px;pointer-events:none;z-index:60}

.round{width:66px;height:66px;border-radius:50%;border:0;background:linear-gradient(#fff,#ffe9c9);box-shadow:0 6px 0 #b98a52,0 10px 14px rgba(0,0,0,.4);cursor:pointer;display:grid;place-items:center}

        if (i) { again(b, 'shake'); snd.nope(); toast(name + ': coming soon!', '곧 열려요'); return; }
        busy = true; snd.pop(); b.querySelector('.mk').remove();
        if (cart.at !== STOP) { await cart.roll(TRACK.slice(cart.at + 1, STOP + 1)); cart.at = STOP; }
        // they hop out of the cart and walk up the path into the cave
        cart.riders(false); pen.put(300, 742); ger.put(262, 748);
        await Promise.all([pen.land(cart.x + 20, cart.y - 90), ger.land(cart.x - 30, cart.y - 90)]);
        await Promise.all([pen.go(232, 712, 170), wait(200).then(() => ger.go(205, 716, 170))]);
        pen.el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 350, fill: 'forwards' }); ger.el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 350, fill: 'forwards' }); await wait(300);
        flash(() => { location.hash = '#/cave'; });
      }; });
    pen = person('penny', 250); ger = person('gerry', 262); pen.el.classList.add('gone'); ger.el.classList.add('gone'); pen.put(300, 742); ger.put(262, 748);
    cart = makeCart(176);
    let from = null; try { from = sessionStorage.getItem('lgr2.from'); sessionStorage.removeItem('lgr2.from'); } catch (e) {}
    if (from === 'cave') {                             // back out of the cave: they walk down to the cart and climb in
      cart.at = STOP; cart.put(TRACK[STOP][0], TRACK[STOP][1]); cart.riders(false); pen.put(232, 712); ger.put(205, 716); pen.el.classList.remove('gone'); ger.el.classList.remove('gone');
      await wait(400); await Promise.all([pen.go(310, 745, 170), wait(200).then(() => ger.go(270, 750, 170))]);
      await Promise.all([pen.dive(cart.x + 20, cart.y - 70), ger.dive(cart.x - 30, cart.y - 70)]); cart.riders(true); snd.pop(); say('gerry', 'Hop in the cart!');
    } else {                                           // the start of a visit: the cart rolls in from the edge of the map
      cart.put(TRACK[0][0], TRACK[0][1]); await wait(500); await cart.roll(TRACK.slice(1, PARK + 1)); cart.at = PARK; say('penny', 'Welcome to Ruby Valley!');
    }
    busy = false;
  }

  // A week's treasure standing on its stone plot. Each picture's BASE (not its middle) goes on the middle of the plot:
  // TRE = width, how far the base is from the picture's middle (as a part of its width), and how far below the plot's
  // middle the base's front edge sits. The flag's pole is at the left of its picture, so it needs the sideways shift.
  const TRE = { 1: [150, .244, 6, .5], 2: [230, 0, 16, .8], 3: [120, 0, 12, .97], 4: [200, 0, 22, .98] };   // last = how wide the base is, as a part of the picture
  function treasure(w, cls) {
    const [x, y] = PLOTS[w - 1], [bw, off, dy, base] = TRE[w], wd = bw * depth(y + 60) * 1.5, b = thing('t' + w, x, y + dy, wd, cls); b.style.setProperty('--bw', (base * wd) + 'px');
    b.querySelector('.in').style.marginLeft = (off * wd) + 'px'; return b;
  }

  // ================= 1. THE CAVE =================
  async function cave(arrive) {
    clear(); busy = true; dfn = near; anchor = .62; WW = 1672; WH = 941; fit(); bg.src = ART + 'cave.jpg'; $('#back').hidden = false;
    $('#back').onclick = async () => { if (busy) return; busy = true; snd.pop(); await both(230, 500); pen.el.classList.add('gone'); ger.el.classList.add('gone'); flash(() => { sessionStorage.setItem('lgr2.from', 'cave'); location.hash = '#/ruby'; }); };
    document.body.classList.add('incave');
    { const m = $('#mbk'), anyVoice = () => (window.MyVoice ? MyVoice.keys() : Promise.resolve([])).then(k => k.length > 0);
      [...m.querySelectorAll('.dots i')].forEach((d, i) => d.classList.toggle('on', weekDone(i + 1))); anyVoice().then(ok => m.classList.toggle('shut', !ok));
      m.onclick = async () => { snd.pop(); m.classList.remove('wob'); void m.offsetWidth; m.classList.add('wob');
        if (!(await anyVoice())) return toast('Do Speak first. Then your book opens!', '말하기를 먼저 해요');
        hush(); if (window.GPTrack) GPTrack.play('lgr', 'monthbook'); flash(() => { location.href = 'speakbook/index.html?month=1&back=' + encodeURIComponent('../kingdom.html#/cave'); }); }; }
    const cur = current(); $('#title').innerHTML = 'Ruby Cave<small>Ruby · 1 · ' + (cur > 4 ? 'all four weeks done!' : 'Week ' + cur) + '</small>';
    const chests = [];
    PLOTS.forEach(([x, y], i) => { const w = i + 1, d = depth(y + 60);
      if (weekDone(w) && arrive !== 'built' + w) chests[w] = treasure(w, 'tre');
      else if (weekDone(w)) chests[w] = thing('chest-open', x, y + 18, 235 * d * 1.25, '');
      else chests[w] = thing('chest', x, y + 18, 235 * d * 1.25, w > cur ? 'locked' : '', w === cur ? '<i class="mk"></i>' : ''); chests[w].week = w; });
    pen = person('penny', 250); ger = person('gerry', 262);
    const hp = PLOTS[Math.min(cur, 4) - 1], home = cur > 4 ? [760, 800] : [hp[0] + 30, hp[1] + 150];   // they stop in front of this week's chest, never past it
    chests.forEach(b => { if (!b) return; b.onclick = async () => {
      if (busy) return; const w = b.week;
      // a finished week can be opened again (user, 21 Nov): tap its treasure and they go back into that week's cabin
      if (b.classList.contains('tre')) { busy = true; again(b, 'squash'); snd.ding(); sparks(b.x, b.y - b.w * .6, 14, 120); toast(WEEKS[w][1] + '!', WEEKS[w][0] + ' · 다시 하기');
        await both(b.x + b.w * .9, b.y + 60, b.w * 1.8); snd.whoosh(); sparks(b.x, b.y - b.w * .5, 26, 190); await pen.dive(b.x, b.y - b.w * .5); await ger.dive(b.x, b.y - b.w * .5); return flash(() => { location.hash = '#/w/' + w; }); }
      if (b.classList.contains('locked')) { again(b, 'shake'); snd.nope(); toast('Finish week ' + cur + ' first!', cur + '주차를 먼저 해요'); if (w === cur + 1) say('gerry', 'This one is next.'); return; }
      busy = true; snd.pop(); const mk = b.querySelector('.mk'); if (mk) mk.remove();
      await both(b.x + b.w * .95, b.y + 46, b.w * 1.9);                 // Penny to the right of the chest, Gerry to its left
      again(b, 'rattle'); snd.creak(); await wait(850);
      b.querySelector('.im').src = ART + 'chest-open.png'; again(b, 'squash'); b.insertAdjacentHTML('beforeend', '<span class="portal"></span>'); snd.whoosh(); sparks(b.x, b.y - b.w * .6, 26, 190); await wait(650);
      const px = b.x, py = b.y - b.w * .52; say('penny', 'Jump in!');
      await pen.dive(px, py); await ger.dive(px, py); await wait(150);
      flash(() => { location.hash = '#/w/' + w; });
    }; });
    if (arrive === 'gate') {                          // they walk in from the cart outside the gate
      pen.put(175, 478); ger.put(120, 470); await wait(350); await both(home[0], home[1]); say('gerry', 'Look! Treasure chests!'); if (cur <= 4) say('penny', 'Tap the chest!');
    } else if (arrive && arrive.startsWith('built')) { // back out of the chest: the chest becomes the treasure they made
      const w = +arrive.slice(5), b = chests[w]; b.insertAdjacentHTML('beforeend', '<span class="portal"></span>');
      pen.put(b.x + 210, b.y + 150); ger.put(b.x + 70, b.y + 160); pen.el.classList.add('gone'); ger.el.classList.add('gone');
      await wait(450); await pen.land(b.x, b.y - b.w * .5); await ger.land(b.x, b.y - b.w * .5); await wait(250);
      snd.whoosh(); sparks(b.x, b.y - b.w * .5, 34, 230); b.remove();
      const t = treasure(w, 'tre pop'); t.week = w; t.onclick = chests[w].onclick; chests[w] = t;
      snd.big(); await wait(350); sparks(t.x, t.y - t.w * .7, 40, 260); pen.pose(5); ger.pose(5); toast('You made the ' + WEEKS[w][1] + '!', WEEKS[w][0] + ' · 미션 완료!'); say('penny', 'You did it, reader!'); await wait(1500); pen.pose(1); ger.pose(1);
      const nx = chests[w + 1]; if (nx) { say('gerry', 'The next chest is open!'); nx.classList.remove('locked'); again(nx, 'squash'); nx.insertAdjacentHTML('beforeend', '<i class="mk"></i>'); snd.ding(); }
      else { toast('Ruby Explorer!', '루비 탐험가가 되었어요'); for (let i = 0; i < 5; i++) setTimeout(() => sparks(300 + Math.random() * 1100, 250 + Math.random() * 300, 26, 220), i * 260); snd.big(); }
      $('#title').querySelector('small').textContent = 'Ruby · 1 · ' + (current() > 4 ? 'all four weeks done!' : 'Week ' + current());
    } else { pen.put(home[0], home[1]); ger.put(home[0] - 110, home[1] - 12); }
    busy = false;
  }

  // ================= 2. INSIDE THE CHEST: THE RUBY CABIN =================
  // 24 Nov 2026 (night), user's own sketch ("Option 1"): like Start PBL's room, the painted cabin is only a faded backdrop
  // and FIVE big tiles sit on top: Watch large on the left, then ABC, Speak / Grammar, My Speaking Book in a block, Gerry and
  // Penny bottom-right, the week's four stars in a bar at the top. Everything lives in #cab, a 1280 x 720 stage scaled to
  // the window (not in the scrolling world). The old painted-toys cabin is kingdom.html.bak-painted-cabin.
  const TILE = { watch: [70, 150, 400, 440], abc: [520, 110, 250, 250], sheet: [800, 110, 250, 250], dictation: [520, 400, 250, 250], book: [800, 400, 250, 250] };
  const fitCab = () => { const c = $('#cab'); if (c) c.style.transform = 'scale(' + Math.min(innerWidth / 1280, innerHeight / 720) + ') translate(-50%,-50%)'; };
  addEventListener('resize', fitCab);
  function burst(el, n = 16, power = 130) { const r = el.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
    for (let i = 0; i < n; i++) { const p = document.createElement('i'); p.className = 'cspark'; p.style.left = x + 'px'; p.style.top = y + 'px'; p.style.background = ['#ffe36a', '#fff', '#ff6f91', '#ffb347'][i % 4]; document.body.appendChild(p);
      const a = Math.random() * 6.283, d = power * (.4 + Math.random() * .8); p.animate([{ transform: 'translate(0,0) scale(1.2)', opacity: 1 }, { transform: 'translate(' + Math.cos(a) * d + 'px,' + (Math.sin(a) * d + 50) + 'px) scale(.2) rotate(240deg)', opacity: 0 }], { duration: 700 + Math.random() * 500, easing: 'cubic-bezier(.2,.7,.3,1)' }).onfinish = () => p.remove(); } }
  async function cabin(w, arrive) {
    clear(); busy = true; dfn = near; anchor = .62; WW = 1672; WH = 941; fit(); bg.src = ART + 'cabin.jpg'; $('#back').hidden = false; document.body.classList.add('soft');
    $('#title').innerHTML = WEEKS[w][0] + '<small>Ruby · 1 · Week ' + w + '</small>';
    const P = parts(w), order = TOYS.map(t => t[0]), next = () => order.find(p => !parts(w)[p]);
    const cab = document.createElement('div'); cab.id = 'cab'; document.body.appendChild(cab); fitCab();
    cab.innerHTML = '<div class="sbar">' + order.map((id, i) => '<span class="sl' + (P[id] ? ' on' : '') + '" data-slot="' + i + '">' + STAR + '</span>').join('') + '</div>' +
      TOYS.map(([id, en, ko], i) => '<button class="tl' + (id === 'watch' ? ' big' : '') + '" data-id="' + id + '" style="left:' + TILE[id][0] + 'px;top:' + TILE[id][1] + 'px;width:' + TILE[id][2] + 'px;height:' + TILE[id][3] + 'px;--k:' + i + '"><img src="art/tiles/' + id + '.png" alt=""><b>' + en + '</b><small>' + ko + '</small>' + (P[id] ? '<span class="tk">' + STAR + '</span>' : '') + '</button>').join('') +
      '<button class="tl bk shut" data-id="book" style="left:' + TILE.book[0] + 'px;top:' + TILE.book[1] + 'px;width:' + TILE.book[2] + 'px;height:' + TILE.book[3] + 'px;--k:4"><img src="art/tiles/book.png" alt=""><b>My Speaking Book</b><small>나의 스피킹 북</small></button>' +
      '<img class="hp" id="hg" src="' + ART + 'gerry/stand.webp" alt="Gerry"><img class="hp" id="hpn" src="' + ART + 'penny/stand.webp" alt="Penny"><span class="hb" id="hbub"></span>';
    const tiles = {}; cab.querySelectorAll('.tl').forEach(b => { tiles[b.dataset.id] = b; }); const sbook = tiles.book;
    // A STAR MEANS THE QUEST IS COMPLETE (user, 24 Nov 2026): ABC, Speak and Grammar give their star only when all six of the
    // week's readings are finished there (before: after the first one). The tile shows how far the child is: "4 / 6".
    const NEED = 6, STORE = { abc: 'lgr.pages', sheet: 'lgr.sheets', dictation: 'lgr.dictations' };
    const howMany = id => { let got = []; try { got = JSON.parse(localStorage.getItem(STORE[id]) || '[]'); } catch (e) {} return Math.min(NEED, new Set(got.filter(x => String(x)[0] === 'abcd'[w - 1])).size); };
    const progress = () => Object.keys(STORE).forEach(id => { const b = tiles[id]; let p = b.querySelector('.pg'); if (parts(w)[id]) { if (p) p.remove(); return; } if (!p) { p = document.createElement('i'); p.className = 'pg'; b.appendChild(p); } const n = howMany(id); p.textContent = n + ' / ' + NEED; p.classList.toggle('some', n > 0); });
    progress();
    const backFrom = (id, name, ko) => { const n = howMany(id); if (parts(w)[id]) return; if (n >= NEED) return give(id);
      toast(n ? n + ' of ' + NEED + ' ' + name + ' done. ' + (NEED - n) + ' more for the star!' : 'Finish all ' + NEED + ' ' + name + ' to get the star!', ko + ' ' + n + ' / ' + NEED); };
    const pose = (g, p) => { const a = $('#hg'), b = $('#hpn'); if (a) a.src = ART + 'gerry/' + g + '.webp'; if (b) b.src = ART + 'penny/' + (p || g) + '.webp'; };
    // a line: the recorded voice, the words in a bubble over the helpers, and the speaker's talking pose
    const tell = (who, text) => { const bub = $('#hbub'); if (bub) { bub.textContent = text; bub.classList.add('on'); clearTimeout(tell.t); tell.t = setTimeout(() => { bub.classList.remove('on'); if ($('#hg')) pose('stand'); }, 3600); } pose(who === 'gerry' ? 'talk' : 'stand', who === 'penny' ? 'talk' : 'stand'); return say(who, text); };
    const voiced = () => (window.MyVoice ? MyVoice.keys() : Promise.resolve([])).then(k => k.some(id => id[0] === 'abcd'[w - 1]));
    voiced().then(ok => sbook.classList.toggle('shut', !ok));
    const mark = () => { cab.querySelectorAll('.tl.next').forEach(t => t.classList.remove('next')); const n = next(); if (n) tiles[n].classList.add('next'); };
    const bounce = b => { b.classList.remove('sq'); void b.offsetWidth; b.classList.add('sq'); };
    sbook.onclick = async () => { if (busy) return; snd.pop(); clearTimeout(nudgeT); bounce(sbook);
      if (!(await voiced())) { snd.nope(); return toast('Do Speak first. Then your book opens!', '말하기를 먼저 해요'); }
      busy = true; burst(sbook); if (window.GPTrack) GPTrack.play('lgr', 'book', { week: w }); await wait(350);
      flash(() => { location.href = 'speakbook/index.html?w=' + w + '&back=' + encodeURIComponent('../kingdom.html#/w/' + w); }); };
    async function give(id) {                          // a finished quest sends its ruby star up to the star bar
      const b = tiles[id], i = order.indexOf(id), slot = cab.querySelector('.sl[data-slot="' + i + '"]'); setPart(w, id);
      b.insertAdjacentHTML('beforeend', '<span class="tk">' + STAR + '</span>'); bounce(b); snd.ding(); burst(b, 18, 150);
      const r0 = b.getBoundingClientRect(), r1 = slot.getBoundingClientRect(), f = document.createElement('div'); f.className = 'cfly'; f.innerHTML = STAR; f.style.left = (r0.left + r0.width / 2) + 'px'; f.style.top = (r0.top + r0.height / 2) + 'px'; document.body.appendChild(f);
      const dx = r1.left + r1.width / 2 - (r0.left + r0.width / 2), dy = r1.top + r1.height / 2 - (r0.top + r0.height / 2);
      await Promise.race([f.animate([{ transform: 'translate(-50%,-50%) scale(.4) rotate(0)' }, { transform: 'translate(calc(-50% + ' + dx * .5 + 'px),calc(-50% + ' + (dy * .5 - 120) + 'px)) scale(1.8) rotate(200deg)', offset: .55 }, { transform: 'translate(calc(-50% + ' + dx + 'px),calc(-50% + ' + dy + 'px)) scale(.62) rotate(360deg)' }], { duration: 900, easing: 'ease-in-out', fill: 'forwards' }).finished, wait(1200)]);
      f.remove(); slot.classList.add('on', 'in'); snd.pop(); burst(slot, 12, 90); pose('cheer');
      mark(); progress(); const got = order.filter(p => parts(w)[p]).length;
      if (got === 1) tell('penny', 'You got a ruby star!'); else if (got === 2) tell('penny', 'Two stars! Keep going!'); else if (got === 3) tell('gerry', 'Three stars! One more!');
      if (!next()) { await wait(500); finish(); }
    }
    async function finish() {                          // four stars become the week's treasure, then back out to the cave
      busy = true; snd.whoosh(); pose('cheer');
      cab.insertAdjacentHTML('beforeend', '<div class="won"><img src="' + ART + 't' + w + '.png" alt=""></div>'); const won = cab.querySelector('.won'), wr = won.getBoundingClientRect();
      await Promise.all([...cab.querySelectorAll('.sl')].map(sl => { const r = sl.getBoundingClientRect(); return Promise.race([sl.animate([{ transform: 'translate(0,0)' }, { transform: 'translate(' + (wr.left + wr.width / 2 - r.left - r.width / 2) + 'px,' + (wr.top + wr.height / 2 - r.top - r.height / 2) + 'px) scale(.5) rotate(360deg)', opacity: .2 }], { duration: 700, easing: 'ease-in', fill: 'forwards' }).finished, wait(900)]); }));
      won.classList.add('on'); burst(won, 40, 260); snd.big(); toast('You made the ' + WEEKS[w][1] + '!', '보물 완성!'); tell('gerry', 'Four stars! Look at your treasure!');
      await wait(2300); setDone(w); flash(() => { sessionStorage.setItem('lgr2.arrive', 'built' + w); location.hash = '#/cave'; });
    }
    order.forEach(id => { const b = tiles[id]; b.onclick = async () => {
      if (busy) return; busy = true; snd.pop(); clearTimeout(nudgeT); bounce(b); pose('point');
      tell(...{ watch: ['gerry', "Let's watch!"], abc: ['penny', "Let's read!"], sheet: ['penny', "Let's speak!"], dictation: ['gerry', "Let's make sentences!"] }[id]);
      snd.boing(); await wait(520); busy = false;
      if (parts(w)[id]) burst(b, 10, 100);
      if (window.GPTrack) GPTrack.play('lgr', id, { week: w });   // the shared GPFIS counter: how many times each quest was opened (kept on this device)
      if (id === 'watch') return play('videos/A-1-w' + w + '-essay.mp4', seen => { if (parts(w).watch) return; if (seen) give('watch'); else toast('Watch to the end to get the star!', '끝까지 보면 별을 받아요'); });   // a star means complete: the video has to be watched (to 90%)
      if (id === 'abc') { sessionStorage.setItem('lgr2.abc', w); return flash(() => { location.href = 'book/index.html?set=a&back=' + encodeURIComponent('../kingdom.html#/w/' + w); }); }
      if (id === 'sheet') { sessionStorage.setItem('lgr2.sheet', w); return flash(() => { location.href = 'sheet/index.html?w=' + w + '&back=' + encodeURIComponent('../kingdom.html#/w/' + w); }); }
      if (id === 'dictation') { sessionStorage.setItem('lgr2.dict', w); return flash(() => { location.href = 'dictation/index.html?w=' + w + '&back=' + encodeURIComponent('../kingdom.html#/w/' + w); }); }
    }; });
    $('#back').onclick = () => { if (busy) return; busy = true; snd.pop(); flash(() => { sessionStorage.setItem('lgr2.arrive', ''); location.hash = '#/cave'; }); };
    await wait(700); mark(); busy = false;
    // a hello only when they arrive from the cave (not on the way back from an activity), then one reminder if nothing happens
    if (!['lgr2.dict', 'lgr2.sheet', 'lgr2.abc'].some(k => sessionStorage.getItem(k) == w) && next()) {
      if (order.some(p => parts(w)[p])) tell('gerry', 'What is next?'); else tell('penny', 'Four quests. Pick one!');
      clearTimeout(nudgeT); nudgeT = setTimeout(() => { if (!busy && $('#player').hidden && location.hash === '#/w/' + w) tell('penny', 'Tap a quest!'); }, 20000); }
    // back from a quest: its star comes once one of this week's readings has been finished there
    if (sessionStorage.getItem('lgr2.dict') == w) { sessionStorage.removeItem('lgr2.dict'); backFrom('dictation', 'Grammar readings', '문법'); }
    if (sessionStorage.getItem('lgr2.sheet') == w) { voiced().then(ok => { if (ok) { sbook.classList.remove('shut'); bounce(sbook); burst(sbook, 16, 130); tell('penny', 'Your Speaking Book is ready!'); } });
      sessionStorage.removeItem('lgr2.sheet'); backFrom('sheet', 'Speak readings', '말하기'); }
    if (sessionStorage.getItem('lgr2.abc') == w) { sessionStorage.removeItem('lgr2.abc'); backFrom('abc', 'ABC books', '읽기'); }
    else if (!next() && !weekDone(w)) finish();
  }

  // ---- video: the real file when it is there ----
  let afterV = null, seenV = true;   // seenV: the video was watched to (nearly) its end; a week with no video file yet counts as seen
  function play(src, after) { afterV = after; seenV = true; $('#vbody').innerHTML = ''; $('#player').hidden = false;
    fetch(src, { method: 'HEAD' }).then(r => r.ok && /video/.test(r.headers.get('content-type') || '')).catch(() => false).then(ok => { $('#vbody').innerHTML = ok ? '<video autoplay playsinline src="' + src + '"></video>' : '<p>Daily Essay video<br>coming soon!</p>';
      // the shared GPFIS video controls (kit/vctl.js; user 24 Nov: every video can go full screen and show its time bar): a clock button
      // for the time bar, a corners button for full screen. Without the kit the browser's own controls are used. A tap on the picture pauses or plays.
      const v = $('#vbody video'); if (!v) return; seenV = false; const near = () => { if (v.ended || (v.duration && v.currentTime >= v.duration * .9)) seenV = true; }; v.addEventListener('timeupdate', near); v.addEventListener('ended', near); v.onclick = () => { if (v.paused) v.play().catch(() => {}); else v.pause(); };
      if (window.VCtl) VCtl.attach($('#vbody')); else v.controls = true; }); }
  $('#closeV').onclick = () => { if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {}); $('#player').hidden = true; $('#vbody').innerHTML = ''; snd.pop(); const a = afterV; afterV = null; if (a) a(seenV); };

  function route() { clearTimeout(nudgeT);
    document.body.classList.remove('front');
    const m = location.hash.match(/^#\/w\/([1-4])$/);
    if (m && +m[1] <= current() ) return cabin(+m[1]);
    if (m && weekDone(+m[1])) return cabin(+m[1]);
    if (location.hash === '#/cave') { let a = 'gate'; try { const v = sessionStorage.getItem('lgr2.arrive'); if (v !== null) { a = v; sessionStorage.removeItem('lgr2.arrive'); } } catch (e) {} return cave(a); }
    if (location.hash === '#/ruby') return valley();
    kingdom();
  }
  addEventListener('hashchange', route); route();
})();
</script><script src="../ext/home.js?v=mwusp8ec" data-home="../demo/street.html"></script></body></html>
