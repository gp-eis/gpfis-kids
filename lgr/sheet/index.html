<script>

  const done = () => { try { return JSON.parse(localStorage.getItem('lgr.sheets') || '[]'); } catch (e) { return []; } };
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const bubble = $('#bubble'); let sayNow = '', mateEl = $('#help');

  function tell(text, o) { const fb = $('#fb'); (fb || bubble).textContent = text; sayNow = (o && o.model) || text; pose('talk'); return Say(sayNow).then(() => pose('stand')); }
  $('#hear').onclick = () => Say(sayNow);

  const shake = el => { el.classList.remove('no'); void el.offsetWidth; el.classList.add('no'); Talk.boop && Talk.boop(); };
  const cheer = el => { const b = el.getBoundingClientRect(); Talk.burst(b.left + b.width / 2, b.top + b.height / 2, 14); Talk.ding(2); };

  if (!R) {

    const books = window.LGR_SET.books, cover = r => { const b = books.find(x => x.id === r.id), [my, ...rest] = r.title.split(' ');
      const inner = '<b>' + my + ' <span>' + rest.join(' ') + '</span></b>' + (b ? icon(b.img, b.img === 'apple' || b.img === 'arrow' ? 150 : 210) : '<em>' + r.L.toUpperCase() + r.L + '</em>') + (got.includes(r.id) ? '<i>⭐</i>' : '');
      return r.q10 ? '<a class="bk" style="background:' + (b ? b.color : '#e9d9bf') + '" href="?r=' + r.id + '&w=' + wk + '&back=' + encodeURIComponent(BACK) + '">' + inner + '</a>' : '<span class="bk" style="background:#cdbfae;opacity:.5">' + inner + '</span>'; };
    document.body.classList.add('reading'); mateEl = $('#help');
    wrap.innerHTML = '<div class="shelf pop"><h1>My ' + WEEK[wk].toUpperCase() + ' Speaking <small>' + got.filter(g => list.some(r => r.id === g)).length + ' / ' + list.length + '</small></h1><div class="covers">' + list.map(cover).join('') + '</div></div>';
    Say('Pick a reading!'); return;
  }

  $('#back').href = '?w=' + wk + '&back=' + encodeURIComponent(BACK);
  $('#title').innerHTML = R.title + '<small>Ruby · 1 · Week ' + wk + ' · speak · 말하기</small>';
  // 24 Nov 2026 (user): Speak is only the speaking part now. Phonics and Nouns and Verbs moved to Grammar (app/dictation);
  // their functions below are no longer in STEPS. The child's take of every line is kept for My Speaking Book (app/speakbook).
  const STEPS = [reading, finish]; let at = 0;
  $('#dots').innerHTML = STEPS.slice(0, -1).map(() => '<i></i>').join('');
  const go = () => { [...$('#dots').children].forEach((d, i) => d.classList.toggle('on', i < at)); STEPS[at](); };
  const next = () => { at++; go(); };

  // ================= 1 READING: ten questions, one for each sentence; the clue lights up; the child says it =================
  function reading() {
    document.body.classList.add('reading');
    const book = (window.LGR_SET.books.find(b => b.id === R.id) || {}), pic = book.img ? icon(book.img, 200) : '';
    wrap.innerHTML = '<div class="two pop"><div class="page"><div class="pic">' + pic + '</div><h2>' + R.title + '</h2><ol class="lines">' +
      R.lines.map((l, i) => '<li class="ln" data-i="' + i + '"><span class="no"><b>' + (i + 1) + '</b></span><span class="tx">' + l.split(' ').map((w, k) => '<span class="w" style="--i:' + k + '">' + w + '</span>').join('') + '</span></li>').join('') + '</ol></div>' +
      '<div class="side"><span class="tag">READ AND SPEAK · 읽고 말하기</span><div class="count">' + R.lines.map(() => '<i></i>').join('') + '</div><div class="qn" id="qn"></div><div class="q" id="q"></div><div id="fb"></div><div id="heard"></div><div id="tst"></div>' +
      '<div class="talkrow"><img id="mate" src="../art/kingdom/penny/stand.webp" alt="Penny">' + (Talk.canHear ? '<button id="mic" aria-label="Speak">🎤</button>' : '<button class="big" id="said" style="margin-bottom:22px">I said it!</button>') +
      '<div class="mini"><button id="listen" aria-label="Listen to the line">🔊</button><button id="again" aria-label="Hear the question again">❓</button><button id="hearme" aria-label="Hear me" disabled>👂</button></div></div></div></div>';
    mateEl = $('#mate');
    const linesEl = $('.lines'), lns = [...document.querySelectorAll('.ln')], dots = [...document.querySelectorAll('.count i')], heardEl = $('#heard'), mic = $('#mic');
    /* THE SPEAKING STYLE THE USER APPROVED IN START PBL (24 Nov 2026, night; she asked for it here too):
       no slow / turtle button · "You said: ..." stays after each try · a word is green only when that EXACT word was heard ·
       three stars only when the whole line was said right, every word and in order (else two at most) · the BEST try of
       each line is kept: its sound (vendor/myvoice.js) and, in localStorage 'lgr.said', its stars, the missed words and
       what was heard: { '<reading id>:<line 0-9>': { s: stars, m: [missed word indexes], h: 'heard text' } }.
       My Speaking Book shows the missed words in red. */
    const NUM = { 0: 'zero', 1: 'one', 2: 'two', 3: 'three', 4: 'four', 5: 'five', 6: 'six', 7: 'seven', 8: 'eight', 9: 'nine', 10: 'ten' };
    const W = t => Talk.words(t).map(x => NUM[x] || x);
    const saidAll = () => { try { return JSON.parse(localStorage.getItem('lgr.said') || '{}') || {}; } catch (e) { return {}; } };
    const starRow = n => '★★★'.split('').map((x, i) => '<b class="' + (i < n ? 'on' : '') + '">★</b>').join('');
    let qi = Math.max(0, Math.min(9, (+Q.get('q') || 1) - 1)), tries = 0, fix = null, busy = false, best = null, lastClip = null;   // best = the best whole-line try of this line: { s, m, h, clip }
    const word = el => Talk.words(el.textContent)[0] || '';
    const ask = () => {                               // the next question: its sentence lights up in the reading
      tries = 0; fix = null; best = null; lastClip = null; heardEl.textContent = ''; $('#tst').innerHTML = ''; $('#hearme').disabled = true; linesEl.classList.add('asking');
      lns.forEach((l, i) => { l.classList.toggle('now', i === qi); l.classList.remove('fixing'); if (i === qi) l.querySelectorAll('.w').forEach(w => w.classList.remove('hit', 'miss', 'focus')); });
      dots.forEach((d, i) => { d.classList.toggle('on', i < qi); d.classList.toggle('at', i === qi); });
      $('#qn').textContent = 'Question ' + (qi + 1) + ' of ' + R.lines.length; $('#q').textContent = R.q10[qi];
      const s = $('.side'); s.classList.remove('shake'); tell('Look at the yellow line. Say it!', { model: [R.q10[qi], 'Look at the yellow line. Say it!'] });
    };
    const keepBest = () => { if (!best) return; const all = saidAll(), key = R.id + ':' + qi, old = all[key];   // a later, worse reading never replaces a better one
      if (old && old.s > best.s) return; all[key] = { s: best.s, m: best.m, h: best.h }; try { localStorage.setItem('lgr.said', JSON.stringify(all)); } catch (e) {} if (best.clip && window.MyVoice) MyVoice.put(key, best.clip); };
    const good = async () => { const l = lns[qi]; keepBest(); best = null; l.classList.remove('now', 'fixing'); l.classList.add('done'); l.querySelectorAll('.w').forEach(w => w.classList.remove('hit', 'miss', 'focus')); cheer(l); pose('cheer');
      qi++; if (qi < R.lines.length) { await wait(900); ask(); } else { dots.forEach(d => { d.classList.add('on'); d.classList.remove('at'); }); linesEl.classList.remove('asking'); await tell('You read the whole story!'); await wait(500); next(); } };
    $('#again').onclick = () => Say(R.q10[qi]); $('#listen').onclick = () => Say(fix ? word(fix[0]) : R.lines[qi]);
    $('#hearme').onclick = () => { if (!lastClip) return; Say.stop(); new Audio(lastClip).play().catch(() => {}); };
    const said = $('#said'); if (said) said.onclick = () => { best = { s: 2, m: [], h: '', clip: null }; good(); };   // no microphone: two stars, as in Start PBL
    if (mic) mic.onclick = async () => {
      if (busy) return; busy = true; Say.stop(); heardEl.textContent = ''; $('#tst').innerHTML = ''; mic.classList.add('live'); $('#fb').textContent = "I'm listening…";
      const line = R.lines[qi], ln = lns[qi], spans = [...ln.querySelectorAll('.w')];
      if (!fix) spans.forEach(x => x.classList.remove('hit', 'miss'));   // a new try starts clean
      const r = await Talk.listen({ ms: 6000, onLevel: v => mic.style.setProperty('--lv', v), onWords: t => heardEl.textContent = t });
      mic.classList.remove('live'); busy = false;
      if (!r.heard.length) { $('.side').classList.add('shake'); setTimeout(() => $('.side').classList.remove('shake'), 400); return tell("I couldn't hear you. Say it loudly!"); }
      heardEl.textContent = 'You said: “' + r.heard[0] + '”'; if (r.clip) { lastClip = r.clip; $('#hearme').disabled = false; }
      if (fix) {                                     // practising one missed word
        const el = fix[0], ok = Talk.score(word(el), r.heard) >= 60; el.n = (el.n || 0) + 1;
        if (!ok && el.n < 3) return tell('Almost! Listen: ' + word(el) + '.', { model: ['Almost! Listen.', word(el)] });
        el.classList.remove('miss', 'focus'); el.classList.add('hit'); cheer(el); fix.shift();
        if (fix.length) { spans.forEach(x => x.classList.toggle('focus', x === fix[0])); return tell('Say just this word: ' + word(fix[0]) + '.', { model: ['Say just this word.', word(fix[0])] }); }
        fix = null; ln.classList.remove('fixing'); return tell('Now say the whole line!', { model: ['Now say the whole line.', line] });
      }
      tries++;
      const same = (a, b) => a === b, heardWords = r.heard.map(W), num = x => NUM[x] || x;   // exact words only (a word that merely starts the same no longer counts)
      spans.forEach(el => { const ok = heardWords.some(H => H.includes(num(word(el)))); el.classList.toggle('hit', ok); el.classList.toggle('miss', !ok); });
      // stars: three ONLY for the whole line, every word exact and in order inside one hearing (extra words around it are fine)
      const LW = W(line), whole = heardWords.some(H => { let k = 0; for (const x of H) if (x === LW[k]) k++; return k === LW.length; });
      const missIdx = LW.map((w, i) => heardWords.some(H => H.includes(w)) ? -1 : i).filter(i => i >= 0);
      let stars = Talk.stars(Talk.score(line, r.heard)); if ((missIdx.length || !whole) && stars > 2) stars = 2;
      $('#tst').innerHTML = starRow(stars); if (!best || stars >= best.s) best = { s: stars, m: missIdx, h: r.heard[0], clip: r.clip || (best && best.clip) || null };
      // an added or out-of-place word: line the two up in order and see what is left over
      const E = LW, raw = r.heard[0].split(' ').filter(Boolean), H = raw.map(w => num(Talk.words(w)[0] || ''));
      const L = Array.from({ length: E.length + 1 }, () => new Array(H.length + 1).fill(0));
      for (let i = E.length - 1; i >= 0; i--) for (let j = H.length - 1; j >= 0; j--) L[i][j] = same(E[i], H[j]) ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
      const keep = new Set(); let i = 0, j = 0;
      while (i < E.length && j < H.length) { if (same(E[i], H[j])) { keep.add(j); i++; j++; } else if (L[i + 1][j] >= L[i][j + 1]) i++; else j++; }
      const extra = raw.map((w, k) => !keep.has(k) && H[k] ? k : -1).filter(k => k >= 0), missed = spans.filter(el => el.classList.contains('miss'));
      if (extra.length && !whole) heardEl.innerHTML = 'You said: “' + raw.map((w, k) => extra.includes(k) ? '<span class="x">' + w + '</span>' : w).join(' ') + '”';
      if (whole) { $('#fb').textContent = 'Wonderful!'; return good(); }
      if (tries >= 3) return tell("Good try! Let's say it together: " + line, { model: ["Good try! Let's say it together.", line] }).then(good);
      if (missed.length && missed.length <= Math.ceil(spans.length / 2)) { fix = missed; ln.classList.add('fixing'); spans.forEach(x => x.classList.toggle('focus', x === fix[0])); return tell('Good try! Say just this word: ' + word(fix[0]) + '.', { model: ['Good try! Say just this word.', word(fix[0])] }); }
      if (extra.length && !missed.length) { const xs = extra.map(k => H[k]).join(' and '); return tell('Almost! I heard an extra word: ' + xs + '.', { model: ['Almost! I heard an extra word.', 'Listen and say it again.', line] }); }
      tell('Good try! Listen and say it again.', { model: ['Good try! Listen and say it again.', line] });
    };
    ask();
  }

  // ================= 2 PHONICS (a): tap the words that start with the letter =================
  function circle() {
    const need = R.start.filter(w => w[0] === R.L).length; let got = 0;
    fresh('<span class="tag">2 · PHONICS · 파닉스</span><div class="ask">Tap the words that start with <b style="color:#e23b4a">' + R.L.toUpperCase() + R.L + '</b>.</div><div class="words">' + R.start.map(w => '<button class="wd">' + w + '</button>').join('') + '</div>');
    tell('Tap the words that start with ' + R.L.toUpperCase() + '.', { model: 'Tap the words that start with the letter ' + R.L + '.' });
    card.querySelectorAll('.wd').forEach(b => b.onclick = async () => {
      if (b.classList.contains('ring')) return; Say(b.textContent);
      if (b.textContent[0] !== R.L) return shake(b);
      b.classList.add('ring'); cheer(b); if (++got === need) { card.querySelectorAll('.wd:not(.ring)').forEach(x => x.classList.add('dim')); await wait(1100); next(); }
    });
  }
  // 2 PHONICS (b): the first letter of two words
  function firstLetter(k = 0) {
    const w = R.first[k], pool = shuffle([R.L, ...shuffle('abcdmst'.split('').filter(c => c !== R.L)).slice(0, 2)]);
    fresh('<span class="tag">2 · PHONICS · 첫 글자</span><div class="ask">What is the first letter?</div><div class="line"><span class="gap" id="gap">&nbsp;</span>' + w.slice(1) + '</div><div class="letters">' + pool.map(c => '<button class="lt">' + c + '</button>').join('') + '</div>');
    tell('What is the first letter of ' + w + '?', { model: ['What is the first letter?', w] });
    card.querySelectorAll('.lt').forEach(b => b.onclick = async () => {
      if (b.textContent !== R.L) return shake(b);
      $('#gap').textContent = R.L; cheer($('#gap')); Say(w); await wait(1200); k + 1 < R.first.length ? firstLetter(k + 1) : next();
    });
  }
  // ================= 3 NOUNS AND VERBS (user, 24 Nov: the real terms, not "naming/doing words"): colour the six story words with the right pot =================
  function namingDoing() {
    let pot = 'n', left = R.nv.length;
    fresh('<span class="tag">3 · NOUNS AND VERBS · 명사와 동사</span><div class="ask">Colour the words!</div><div class="pots"><button class="pot n on" data-p="n">Noun<small>명사</small></button><button class="pot v" data-p="v">Verb<small>동사</small></button></div>' +
      '<div class="words">' + shuffle(R.nv).map(([w, t]) => '<button class="wd" data-t="' + t + '">' + w + '</button>').join('') + '</div>');
    tell('Pick a colour, then tap the words.', { model: 'Blue for nouns. Orange for verbs. Pick a colour, then tap the words.' });
    card.querySelectorAll('.pot').forEach(p => p.onclick = () => { pot = p.dataset.p; Talk.pop(); card.querySelectorAll('.pot').forEach(x => x.classList.toggle('on', x === p)); });
    card.querySelectorAll('.wd').forEach(b => b.onclick = async () => {
      if (b.classList.contains('n') || b.classList.contains('v')) return; Say(b.textContent);
      if (b.dataset.t !== pot) return shake(b);
      b.classList.add(pot); cheer(b); if (--left === 0) { await wait(1000); next(); }
    });
  }
  function finish() {
    const got = done(); if (!got.includes(R.id)) { got.push(R.id); try { localStorage.setItem('lgr.sheets', JSON.stringify(got)); } catch (e) {} }
    [...$('#dots').children].forEach(d => d.classList.add('on'));
    fresh('<div class="stars">★★★</div><div class="ask">You did it!</div><div class="hint">' + R.title + '</div><div class="bar"><a class="big" style="text-decoration:none" href="' + BACK + '">Back to the cabin</a><a class="big" style="text-decoration:none;background:#fff;box-shadow:0 6px 0 #e2c9b0" href="?w=' + wk + '&back=' + encodeURIComponent(BACK) + '">Another reading</a></div>');
    pose('cheer'); tell('You did it! Great job!'); Talk.ding(3); const b = card.getBoundingClientRect(); for (let i = 0; i < 4; i++) setTimeout(() => Talk.burst(b.left + Math.random() * b.width, b.top + Math.random() * b.height, 18), i * 220);
  }
  if (Q.get('step')) at = Math.max(0, Math.min(STEPS.length - 1, +Q.get('step')));   // for checking pictures
  go();
})();
</script><script src="../vendor/rotate.js?v=mwvhb14d" data-base="../"></script><script src="../../ext/home.js?v=mwvhb14d" data-home="../../demo/street.html"></script></body></html>
