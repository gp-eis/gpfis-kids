<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Start PBL · Airship</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sky.css?v=mwq66eyp">
<link rel="stylesheet" href="room.css?v=mwq66eyp">
</head>
<body>
<!-- Start PBL airship world (test). Built the Fresh Math way: one stage, cut-outs that move, sounds made in code.
     The opening, child picker and listen/speak piece belong to the shared GPFIS site, not here. -->
<div id="stage">
  <canvas id="sea"></canvas>
  <div id="world"></div>
  <div id="ship"><div class="tilt">
    <img class="hull" src="art/ship.png" alt="">
    <img class="crew g" src="art/crew/gerry/stand.webp" alt="">
    <img class="crew p" src="art/crew/penny/stand.webp" alt="">
    <img class="front" src="art/ship.png" alt="">
    <div class="prop"><i></i></div>
  </div></div>
  <div id="clouds"></div>
  <section id="isle"></section>
  <canvas id="fx"></canvas>
  <div id="top">
    <button id="back" class="pill">← Airship <small>비행선</small></button>
    <div id="title" class="pill">START PBL</div>
    <div id="place" class="pill"></div>
    <div id="compass" class="pill"><b>➤</b><span></span></div>
    <button id="mapbtn" class="pill">Map <small>지도</small></button>
    <div id="stars" class="pill">★ <span>0</span></div>
  </div>
  <div class="zoom"><button id="zin" class="pill" title="Closer">+</button><button id="zout" class="pill" title="Further away">−</button></div>
  <button id="land">⚓ Land here! <small>착륙!</small></button>
  <div id="hint">Hold and drag to fly · scroll or − to see more <small>누르고 끌어서 비행해요</small></div>
  <div id="toast"></div>
  <div id="map"></div>
  <div id="inside"></div>
  <div id="card"></div>
  <div id="party"><div class="rays"></div><div class="box"><h1></h1><p></p><button class="go"></button></div></div>
</div>
<script src="art/isle1/sprites.js?v=mwq66eyp"></script>
<script src="art/isle2/sprites.js?v=mwq66eyp"></script>
<script src="art/isle3/sprites.js?v=mwq66eyp"></script>
<script src="kit/talk.js?v=mwq66eyp"></script>
<script src="crew.js?v=mwq66eyp"></script>
<script src="room.js?v=mwq66eyp"></script>
<script src="sky.js?v=mwq66eyp"></script>
<script src="../ext/home.js?v=mwq66eyp" data-home="../demo/street.html"></script></body>
</html>
