<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>GPFIS</title>
<!-- GPFIS phone frame for the three programmes (Start PBL, Let's Go Readers, Fresh Math), like GB Magic Library's play.html.
     The programmes are landscape screens. On a phone or tablet they open inside this frame:
     - held upright, the programme is drawn turned 90 degrees and fills the screen, so the child just turns the phone;
     - on Android the first tap asks for full screen and locks the screen sideways (iPhones cannot do that from a web page);
     - the frame stays while the programme moves between its own pages, so full screen survives.
     Address: play.html?u=pbl/index.html (only pages inside pbl/, lgr/ and fm/ are accepted).
     kit/home.js sends touch devices here automatically; computers open the programme directly. -->
<style>
html,body{margin:0;height:100%;background:#101536;overflow:hidden;overscroll-behavior:none;touch-action:none}
#f{position:fixed;left:0;top:0;border:0;transform-origin:0 0;background:#101536}
</style>
<iframe id="f" allow="microphone; autoplay; fullscreen" allowfullscreen></iframe>
<script>(function(){var V="mwuf15y6";try{fetch("./version.txt?"+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.text():""}).then(function(t){t=(t||"").trim();if(!t||t===V)return;var u=new URL(location.href);if(u.searchParams.get("v")===t)return;u.searchParams.set("v",t);location.replace(u.href)}).catch(function(){})}catch(e){}if(window.top===window.self){var m=function(){var d=document.createElement("div");d.textContent=V;d.style.cssText="position:fixed;right:3px;bottom:2px;z-index:2147483647;font:9px/1 monospace;color:#fff;background:rgba(0,0,0,.35);padding:1px 3px;border-radius:3px;pointer-events:none";document.body&&document.body.appendChild(d)};document.body?m():addEventListener("DOMContentLoaded",m)}})();</script><script>
const q = new URLSearchParams(location.search), f = document.getElementById('f');
let u = q.get('u') || 'pbl/index.html';
if (!/^(pbl|lgr|fm)\/[A-Za-z0-9_./?=&%-]*$/.test(u) || u.includes('..')) u = 'pbl/index.html';   // only our own programme pages
/* The programmes' screens were designed for a laptop-size window (about 720 px tall or more). A phone held sideways is only
   about 360 px tall, where their cards and panels get cut off. So on short screens the programme is laid out as if the
   window were MIN_H tall (and proportionally wider) and the whole thing is shrunk to fit: nothing is cut, the same picture
   as on a laptop, just smaller. ?h=600 in the address tries another height. */
const MIN_H = +q.get('h') || 720;
function fit() {
  const w = innerWidth, h = innerHeight, up = h > w, LW = up ? h : w, LH = up ? w : h;   // the landscape size we draw in
  const k = Math.min(1, LH / MIN_H);
  Object.assign(f.style, { width: LW / k + 'px', height: LH / k + 'px',
    transform: (up ? `translate(${w}px,0) rotate(90deg) ` : '') + (k < 1 ? `scale(${k})` : '') });
}
addEventListener('resize', fit); addEventListener('orientationchange', () => setTimeout(fit, 250)); fit();
const v = q.get('v'); f.src = v ? u + (u.includes('?') ? '&' : '?') + 'v=' + encodeURIComponent(v) : u;   // v = this upload's stamp: the phone fetches the newest programme page
/* Android: the first touch inside the programme goes full screen and locks sideways */
let asked = false;
const PHONE = matchMedia('(hover: none) and (pointer: coarse)').matches;   // phones and tablets only: a computer keeps its window
function goFull() {
  if (!PHONE || asked) return; asked = true;
  const d = document.documentElement;
  try { if (d.requestFullscreen && !document.fullscreenElement) d.requestFullscreen({ navigationUI: 'hide' }).then(() => screen.orientation && screen.orientation.lock ? screen.orientation.lock('landscape') : null).catch(() => {}); } catch (e) {}
}
f.addEventListener('load', () => {
  try { f.contentWindow.addEventListener('pointerdown', goFull, true); document.title = f.contentDocument.title || 'GPFIS'; } catch (e) {}
});
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) asked = false; fit(); });
</script>
</html>
