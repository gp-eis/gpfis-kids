  const PAGES = [null]; (MONTH ? weeksIn : [wk]).forEach(w => weekList(w).forEach(r => PAGES.push({ r, w })));
  const N = PAGES.length, seen = new Set([0]); let at = Math.max(0, Math.min(N - 1, +Q.get('p') || 0)), run = 0, audio = null;
  $('#back').href = BACK;
  $('#sub').textContent = 'Ruby · ' + NUM + (MONTH ? ' · Letters A–D' : ' · Week ' + wk) + ' · 나의 스피킹 북';
  const hush = () => { clearTimeout(say.t); $('#bub').textContent = ''; };
  const note = t => { $('#bub').textContent = t; clearTimeout(say.t); say.t = setTimeout(() => { $('#bub').textContent = ''; }, 2600); };
  function say(t) { $('#bub').textContent = t; $('#pen').src = '../art/kingdom/penny/talk.webp'; Promise.race([Say(t, { who: 'penny' }), wait(5000)]).then(() => { $('#pen').src = '../art/kingdom/penny/stand.webp'; }); clearTimeout(say.t); say.t = setTimeout(() => { $('#bub').textContent = ''; }, 6000); }
  const quiet = () => { run++; if (audio) { audio.pause(); audio = null; } Say.stop(); document.querySelectorAll('.ln.now').forEach(x => x.classList.remove('now')); const l = $('.listen'); if (l) { l.classList.remove('stop'); l.querySelector('b').textContent = '▶'; } };
  const sparks = el => { const r = el.getBoundingClientRect(); for (let i = 0; i < 16; i++) { const s = document.createElement('i'); s.className = 'spark'; s.style.left = (r.left + r.width / 2) + 'px'; s.style.top = (r.top + r.height / 2) + 'px'; s.style.background = ['#ffe36a', '#fff', '#ff6f91', '#ffb347'][i % 4]; document.body.appendChild(s);
    const a = Math.random() * 6.283, d = 70 + Math.random() * 110; s.animate([{ transform: 'translate(0,0) scale(1.2)', opacity: 1 }, { transform: 'translate(' + Math.cos(a) * d + 'px,' + (Math.sin(a) * d + 40) + 'px) scale(.2) rotate(240deg)', opacity: 0 }], { duration: 700 + Math.random() * 400, easing: 'cubic-bezier(.2,.7,.3,1)' }).onfinish = () => s.remove(); } };

  // one kept take (in sample mode: Penny's own recording of the line stands in for the child)
  async function playLine(r, i, mine) {
    const btn = document.querySelectorAll('.ln')[i]; if (btn) btn.classList.add('now');
    if (SAMPLE) { await Promise.race([Say(r.lines[i], { who: 'penny' }), wait(7000)]); }
    else { const blob = await MyVoice.get(r.id + ':' + i); if (blob && mine === run) { const url = URL.createObjectURL(blob), a = audio = new Audio(url);
      await new Promise(res => { a.onended = a.onerror = res; a.play().catch(res); const iv = setInterval(() => { if (mine !== run || a.ended) { clearInterval(iv); res(); } }, 120); setTimeout(res, 12000); }); URL.revokeObjectURL(url); if (audio === a) audio = null; } }
    if (btn) btn.classList.remove('now'); return mine === run;
  }
  async function playPage(r, mine) {   // every kept line of this page, in order
    const l = $('.listen'); if (l) { l.classList.add('stop'); l.querySelector('b').textContent = '■'; }
    for (let i = 0; i < r.lines.length; i++) { if (!have.has(r.id + ':' + i)) continue; if (!(await playLine(r, i, mine))) return false; await wait(300); if (mine !== run) return false; }
    if (l) { l.classList.remove('stop'); l.querySelector('b').textContent = '▶'; } return true;
  }

  function draw(dir) {
    const B = $('#book'), P = PAGES[at], cls = 'turn' + (dir < 0 ? ' back' : '');
    if (!P) { B.innerHTML = '<button class="cover ' + cls + '" id="cv" aria-label="Open the book" style="background-image:url(../art/pages/' + NUM + '/cover.webp)"></button><span class="by">My Speaking Book' + (MONTH ? '<span class="w4">' + [1, 2, 3, 4].map(w => '<i class="' + (inBook(w) ? 'on' : '') + '"></i>').join('') + '</span><small>' + weeksIn.length + ' of 4 weeks · 4주 중 ' + weeksIn.length + '주</small>' : '') + '</span>'; $('#cv').onclick = () => { if (N > 1) show(1); else note('Do Speak first! · 말하기를 먼저 해요'); }; return; }
    const r = P.r, n = count(r), meta = i => SAID[r.id + ':' + i], got = r.lines.reduce((t, l, i) => t + ((meta(i) || {}).s || 0), 0), scored = r.lines.some((l, i) => meta(i));
    const words = (l, i) => { const m = (meta(i) || {}).m || []; return l.split(' ').map((w, k) => '<u class="' + (m.includes(k) ? 'miss' : '') + '">' + w + '</u>').join(' '); };
    const row = n3 => '★★★'.split('').map((x, k) => k < n3 ? '<b>★</b>' : '★').join('');
    const H = [14, 26, 34, 20, 38, 28, 16, 32, 36, 22, 30, 18, 34, 24, 12, 28, 36, 20];
    const here = '../speakbook/index.html?' + (MONTH ? 'month=1' : 'w=' + wk) + (SAMPLE ? '&sample=1' : '') + '&p=' + at + '&back=' + encodeURIComponent(BACK);
    B.innerHTML = '<div class="spread ' + cls + '"><div class="pg"><img alt="' + r.title + '" src="../art/pages/' + NUM + '/' + pageOf(r) + '.webp"></div><div class="pg R">' +
      '<div class="card">' + r.title + '<small>' + (n ? (scored ? '<b>★ ' + got + '</b> / ' + r.lines.length * 3 : n + ' lines · ' + n + '줄') : 'Nothing yet · 아직') + '</small></div>' +
      '<button class="listen' + (n ? '' : ' none') + '"><b>▶</b><span class="wave">' + H.map((h, k) => '<i style="--h:' + h + ';--k:' + k + '"></i>').join('') + '</span>Listen!</button>' +
      '<div class="lines">' + r.lines.map((l, i) => '<button class="ln' + (have.has(r.id + ':' + i) ? '' : ' none') + '" aria-label="Line ' + (i + 1) + '"' + (meta(i) && meta(i).h ? ' title="You said: ' + String(meta(i).h).replace(/"/g, '') + '"' : '') + '><s>' + (have.has(r.id + ':' + i) ? '▶' : '●') + '</s><span class="tx">' + words(l, i) + '</span><em>' + (meta(i) ? row(meta(i).s) : '') + '</em>' + '</button>').join('') + '</div>' +
      '<a class="again" href="../sheet/index.html?r=' + r.id + '&w=' + P.w + '&back=' + encodeURIComponent(here) + '">🎤 ' + (n ? 'Say it again' : 'Say it in Speak') + '</a></div></div>';
    const L = $('.listen'); L.onclick = async () => { if (!n) return; if (L.classList.contains('stop')) return quiet(); quiet(); hush(); const mine = run; if (await playPage(r, mine)) { Talk.ding && Talk.ding(2); sparks(L); } };
    document.querySelectorAll('.ln').forEach((b, i) => b.onclick = async () => { if (b.classList.contains('none')) return note('Say it in Speak first! · 먼저 말해요'); quiet(); hush(); Talk.pop && Talk.pop(); await playLine(r, i, run); });
  }
  function bar() {
    const P = PAGES[at], curW = P ? P.w : (MONTH ? 0 : wk);
    const dots = PAGES.map((x, i) => x && x.w === curW ? i : -1).filter(i => i > 0);   // this week's readings, as their own pictures
    $('#tabs').innerHTML = '<button class="tab cv' + (at === 0 ? ' on' : '') + '" data-i="0">Cover</button>' +
      (MONTH ? [1, 2, 3, 4].map(w => { const first = PAGES.findIndex(x => x && x.w === w), ok = first > 0 && weekHas(w); return '<button class="tab' + (w === curW ? ' on' : '') + (ok ? '' : ' off') + '" data-i="' + (ok ? first : -1) + '">Week ' + w + '</button>'; }).join('') : '') +
      '<button id="hear"' + (have.size ? '' : ' disabled') + '>▶ Hear my whole book</button>' + '<a id="done" class="' + (MONTH ? 'on m' : seen.size >= N ? 'on' : '') + '" href="' + BACK + '">Done ✓</a>';   // the month's book can be closed at any time
    $('#tabs').querySelectorAll('[data-i]').forEach(b => b.onclick = () => { const i = +b.dataset.i; if (i < 0) return note('Not yet! · 아직이에요'); show(i); });
    $('#hear').onclick = hearAll;
    $('#prev').hidden = at === 0; $('#next').hidden = at === N - 1; $('#next').classList.toggle('go', at === 0);
  }
  function show(i, keep) { const dir = i - at; if (!keep) { quiet(); hush(); } at = Math.max(0, Math.min(N - 1, i)); const was = seen.size; seen.add(at); if (Talk.pop) Talk.pop(); draw(dir); bar(); if (!MONTH && seen.size === N && was < N) { sparks($('#done')); if (!SAMPLE) try { const o = JSON.parse(localStorage.getItem('lgr.speakbooks') || '{}'); o['w' + wk] = 1; localStorage.setItem('lgr.speakbooks', JSON.stringify(o)); } catch (e) {} } }   // the week's book has been read through: kept for the reports ('lgr.speakbooks' = { w1: 1, ... })
  async function hearAll() {
    const h = $('#hear'); if (h.classList.contains('stop')) { quiet(); return bar(); }
    quiet(); hush(); const mine = run; let i = at === 0 ? 1 : at;
    for (; i < N; i++) { if (mine !== run) return; if (!count(PAGES[i].r)) continue; show(i, true); const b = $('#hear'); b.textContent = '■ Stop'; b.classList.add('stop'); await wait(600); if (mine !== run) return; if (!(await playPage(PAGES[i].r, mine))) return; await wait(500); }
    if (mine !== run) return; bar(); Talk.ding && Talk.ding(3); sparks($('#hear')); say('You did it! Great job!');
  }
  $('#prev').onclick = () => show(at - 1); $('#next').onclick = () => show(at + 1);
  addEventListener('keydown', e => { if (e.key === 'ArrowRight' && at < N - 1) show(at + 1); if (e.key === 'ArrowLeft' && at > 0) show(at - 1); });
  addEventListener('pagehide', quiet);
  draw(0); bar();
  if (at === 0 && (!navigator.userActivation || navigator.userActivation.hasBeenActive)) say('This is your Speaking Book!');
})();
