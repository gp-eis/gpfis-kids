<script>
const stage = document.getElementById('stage'), P = document.getElementById('penny'), img = document.getElementById('pimg'), bub = document.getElementById('bub');
/* Penny is whole-body pose pictures drawn from GP's Penny (art/penny, one ChatGPT pose sheet so she is the same girl in
   every pose): stand, blink, talk, wave, cheer, point and walking steps. The page only adds classes (walk / left / right /
   hop / wave) and says when she talks; this picks the picture. No cut-apart limbs any more. */
/* two helpers, the child picks: Penny or Gerry (GP's own characters; Gerry wears his uniform). Each has the same set of
   pose pictures in art/<id>/. Chosen with the round face button (kept on this device as gpfis.mate) or ?mate=gerry. */
const MATES = {
  penny: { name: 'Penny', pitch: 1.4, stand: 431, poses: { stand: [281, 431], blink: [281, 431], talk: [280, 431], wave: [281, 431, -4], cheer: [293, 431], point: [307, 441, -10],
    r1: [260, 440], r2: [222, 441], r3: [248, 443], r4: [225, 444], l1: [255, 445], l2: [223, 445], l3: [250, 442], l4: [232, 449] } },
  gerry: { name: 'Gerry', pitch: 1.15, stand: 446, poses: { stand: [194, 446], blink: [198, 447], talk: [194, 447], wave: [246, 448, -22], cheer: [282, 443], point: [263, 452, 28], think: [196, 454], thumb: [215, 455, -8], pointl: [261, 452, -14], pointr: [265, 452, 12],   // pointl = the same way Penny points
   
    r1: [229, 451], r2: [196, 448], r3: [224, 451], r4: [202, 446], l1: [235, 455], l2: [192, 453], l3: [221, 455], l4: [194, 451] } },
};
const mateId = 'penny';   // Penny leads the way; Gerry walks along behind her (see "Gerry follows" below). Both are always there.
const MATE = MATES[mateId], ART = '../art/' + mateId + '/', PK = 440 / MATE.stand, POSES = MATE.poses;   // both helpers stand 440 stage px tall (a little smaller so the two fit side by side)
img.alt = MATE.name;
const WALK = { right: ['r1', 'r2', 'r3', 'r4'], left: ['l1', 'l2', 'l3', 'l4'] };
Object.keys(POSES).forEach(k => { new Image().src = ART + k + '.webp'; });
let arrivedAt = -1e9, poseNow = '', talking = false, blinkT = 0, cheerT = 0, waveT = 0, pointT = 0;
function setPose(k) {
  if (k === poseNow || !POSES[k]) return; poseNow = k; const [w, h, dx = 0] = POSES[k];
  img.src = ART + k + '.webp'; Object.assign(img.style, { width: w * PK + 'px', height: h * PK + 'px', left: (-w / 2 + dx) * PK + 'px', top: -h * PK + 'px' });
}
new MutationObserver(() => { const now = performance.now();
  if (P.classList.contains('hop') && !P._hop) cheerT = now + 750; P._hop = P.classList.contains('hop');
  if (P.classList.contains('wave') && !P._wave) waveT = now + 1500; P._wave = P.classList.contains('wave');
}).observe(P, { attributes: true, attributeFilter: ['class'] });
setInterval(() => { const now = performance.now(), c = P.classList;
  if (c.contains('walk')) return setPose(WALK[c.contains('left') ? 'left' : 'right'][Math.floor(now / 140) % 4]);
  if (now < cheerT) return setPose('cheer');
  if (now < waveT) return setPose('wave');
  if (now < pointT) return setPose('point');   // she HOLDS the point while she names the place (no flicking between pictures)
  if (talking) return setPose(Math.floor(now / 180) % 2 ? 'talk' : 'stand');
  setPose(now < blinkT ? 'blink' : 'stand');
}, 50);
setInterval(() => { blinkT = performance.now() + 150; }, 3200);
document.getElementById('world').appendChild(document.getElementById('penny')); document.getElementById('world').appendChild(document.getElementById('bub'));
/* where Penny stands (her feet) in front of each place, and what she says */
const PLACES = {
  home:  { x: 1060, y: 885, say: '' },
  /* the pair stands just to the RIGHT of each sign (Penny, then Gerry on her right), so when they both point up-left they point at that place's own sign */
  pbl:   { x: 610,  y: 850, say: 'Start PBL!', logo: '../ext/logos/start-pbl.png' },
  lgr:   { x: 995,  y: 835, say: "Let's Go Readers!", logo: '../ext/logos/lets-go-readers.png' },
  fm:    { x: 1385, y: 850, say: 'Fresh Math!', logo: '../ext/logos/fresh-math.png' },
  books: { x: 345,  y: 905, say: 'Our new books!', logo: '' },
  hall:  { x: 3060, y: 900, say: 'My Hall of Fame!', logo: '' },
};
/* the cobblestone path: Penny walks via these points so she stays on it */
/* one path through the whole panorama: Hall of Fame → garden bridge (painted path curving down) → street */
const PATH = [[2852, 895], [2500, 920], [2200, 930], [1960, 915], [1880, 890], [1830, 850], [1760, 803], [1700, 792], [1536, 795], [1440, 805], [1250, 845], [1060, 885], [700, 900], [420, 930]];
const sceneOf = p => (p.x >= 1700 ? 1 : 0);

/* ONE panorama (options/art/pano/street-pano.png, 3608 x 1024): the street (0–1536), a painted garden bridge, and the
   Hall of Fame (centre x 2852). The whole height is always shown (nothing cut off, no mirrored copies); the window shows
   as much of the panorama's width as fits, and the camera slides along it. While Penny is on the street the camera rests
   on the street; on the garden path it glides with her; at the Hall of Fame it rests there. */
const PW = 3608, world = document.getElementById('world'); let FIT = { s: 1, left: 0, top: 0, ox: 0 }, SCN = 0;
let pos = { x: PLACES.home.x, y: PLACES.home.y }, at = null, target = null, raf = 0, sound = true;
const focusFor = x => x <= 1500 ? 768 : x >= 2700 ? 2852 : 768 + (x - 1500) / 1200 * (2852 - 768);
function fit() {
  Turn.update(); const w = Turn.W, h = Turn.H;
  let s = h / 1024; if (w / s < 1400) s = w / 1400;              // tall windows: keep most of the street's width, soft fill above/below
  const top = (h - 1024 * s) / 2;
  const focus = Math.max(focusFor(pos.x), pos.x + 320 - w / s / 2);   // on narrow windows the view slides a little so Gerry, on her right, is never cut off
  const left = Math.min(0, Math.max(w - PW * s, w / 2 - focus * s));
  world.style.transform = `translate(${left}px,${top}px) scale(${s})`; FIT = { s, left, top, ox: left };
  const k = Math.max(.55, Math.min(1, s)); ['me', 'snd'].forEach(id => document.getElementById(id).style.transform = `scale(${k})`);
}
addEventListener('resize', fit);
function pan(sc) { SCN = sc; }   // kept for the fun layer (whoosh when Penny heads to the other end)

/* ---------- Gerry follows: he walks along Penny's own footsteps, about a step and a half behind her ---------- */
const G = document.createElement('div'); G.id = 'gerry';
G.innerHTML = '<div class="shadow"></div><div class="body"><img id="gimg" src="../art/gerry/stand.webp" alt="Gerry" draggable="false"></div>';
const gimg = G.querySelector('img'), GM = MATES.gerry, GK = 440 / GM.stand, GAP = 190, BESIDE = 200;
document.getElementById('world').appendChild(G);
Object.keys(GM.poses).forEach(k => { new Image().src = '../art/gerry/' + k + '.webp'; });
let gSide = 1, trail = [], gpos = null, gPose = '', gDir = 'left', gMovedAt = 0, gWaveT = 0, gThumbT = 0, gTalking = false;
function crumb() {
  const last = trail[trail.length - 1];
  if (!last || Math.hypot(pos.x - last.x, pos.y - last.y) > 260) { trail = [{ x: pos.x + 200, y: pos.y }, { x: pos.x, y: pos.y }]; gpos = null; gSide = 1; }   // start, or a jump: he stands beside her
  else if (Math.hypot(pos.x - last.x, pos.y - last.y) > 3) { trail.push({ x: pos.x, y: pos.y }); if (trail.length > 400) trail.shift(); }
}
function gSet(k) { if (k === gPose || !GM.poses[k]) return; gPose = k; const [w, h, dx = 0] = GM.poses[k];
  gimg.src = '../art/gerry/' + k + '.webp'; Object.assign(gimg.style, { width: w * GK + 'px', height: h * GK + 'px', left: (-w / 2 + dx) * GK + 'px', top: -h * GK + 'px' }); }
setInterval(() => {
  if (!trail.length) return; const now = performance.now();
  // the point GAP px back along the trail from Penny
  let left = GAP, i = trail.length - 1, t = trail[i];
  while (i > 0 && left > 0) { const a = trail[i], b = trail[i - 1], d = Math.hypot(a.x - b.x, a.y - b.y); if (d >= left) { t = { x: a.x + (b.x - a.x) * left / d, y: a.y + (b.y - a.y) * left / d }; left = 0; } else { left -= d; t = b; i--; } }
  if (!gpos) gpos = { x: t.x, y: t.y };
  /* when Penny stands still he comes to stand SIDE BY SIDE with her (same line, never in front of or behind her) */
  if (P.classList.contains('walk')) gSide = 0;
  else { gSide = 1; t = { x: pos.x + BESIDE, y: pos.y }; }   // always on her right
  const dx = t.x - gpos.x, dy = t.y - gpos.y, d = Math.hypot(dx, dy), step = Math.min(d, 24);
  if (d > 1) { gpos.x += dx / d * step; gpos.y += dy / d * step; gMovedAt = now; if (Math.abs(dx) > 1) gDir = dx < 0 ? 'left' : 'right'; }
  const moving = now - gMovedAt < 130;
  G.style.transform = `translate(${gpos.x}px,${gpos.y}px) scale(${depth(gpos.y)})`; G.style.zIndex = Math.round(gpos.y) - 1;
  G.classList.toggle('walk', moving); G.classList.toggle('gone', P.classList.contains('gone'));
  if (moving) return gSet(WALK[gDir][Math.floor(now / 140) % 4]);
  if (now < cheerT + 180) return gSet('cheer');            // he cheers with her, a beat later
  if (now < gWaveT) return gSet('wave');
  if (gTalking) return gSet(Math.floor(now / 180) % 2 ? 'talk' : 'stand');
  if (now < gThumbT) return gSet('thumb');
  if (now < pointT) return gSet(GM.poses.pointl ? 'pointl' : 'stand');            // he points the SAME way as Penny while she names the place
  gSet(now < blinkT + 900 && now > blinkT + 750 ? 'blink' : 'stand');
}, 40);
const depth = y => 0.72 + (y - 780) / 240 * 0.28;            // further up the street = smaller
const vx = x => x;
let camX = null;
function place() {
  P.style.transform = `translate(${pos.x}px,${pos.y}px) scale(${depth(pos.y)})`; P.style.zIndex = Math.round(pos.y);
  crumb();
  const f = Math.round(pos.x); if (f !== camX) { camX = f; fit(); }   // the camera follows her along the garden path
}
place(); fit();

/* route: from where she is, along the path, to the place */
function along(PATH, from, to) {
  const nearest = p => PATH.reduce((b, q, i) => Math.hypot(q[0] - p.x, q[1] - p.y) < Math.hypot(PATH[b][0] - p.x, PATH[b][1] - p.y) ? i : b, 0);
  const a = nearest(from), b = nearest(to), pts = [];
  if (a <= b) for (let i = a; i <= b; i++) pts.push(PATH[i]); else for (let i = a; i >= b; i--) pts.push(PATH[i]);
  return [...pts.map(([x, y]) => ({ x, y })), { x: to.x, y: to.y }];
}
const route = to => along(PATH, pos, to);
function walkTo(k) {
  if (k === target || (k === at && !target)) { if (k === at && performance.now() - arrivedAt > 4000) arrive(k); return; }   // already here: don't cheer and point again on every hover
  target = k; hush(); cancelAnimationFrame(raf);
  const pts = route(PLACES[k]); let i = 0, last = performance.now(), dustT = 0;
  pan(sceneOf(PLACES[k]));
  P.classList.add('walk');
  const step = now => {
    const dt = Math.min(50, now - last) / 1000; last = now;
    let goal = pts[i]; let dx = goal.x - pos.x, dy = goal.y - pos.y, d = Math.hypot(dx, dy);
    while (d < 6 && i < pts.length - 1) { i++; goal = pts[i]; dx = goal.x - pos.x; dy = goal.y - pos.y; d = Math.hypot(dx, dy); }
    if (d < 6 && i === pts.length - 1) { pos = { x: goal.x, y: goal.y }; place(); P.classList.remove('walk'); target = null; at = k; arrive(k); return; }
    const v = 520 * depth(pos.y) * dt;                          // speed (px per second, slower far away)
    pos.x += dx / d * Math.min(v, d); pos.y += dy / d * Math.min(v, d);
    if (Math.abs(dx) > 4) { P.classList.toggle('left', dx < 0); P.classList.toggle('right', dx > 0); }
    place();
    if ((dustT += dt) > .16) { dustT = 0; puff(); }
    raf = requestAnimationFrame(step);
  };
  raf = requestAnimationFrame(step);
}
function puff() {
  const d = document.createElement('div'); d.className = 'dust';
  d.style.left = vx(pos.x) + (Math.random() * 40 - 20) + 'px'; d.style.top = pos.y - 6 + 'px';
  world.appendChild(d); setTimeout(() => d.remove(), 720);
}
/* at the door: turn to us, hop, say the name */
function arrive(k) {
  P.classList.remove('left', 'right', 'wave'); P.classList.remove('hop'); void P.offsetWidth; P.classList.add('hop');
  light(k);
  const say = PLACES[k].say; if (!say) return;
  pointT = performance.now() + 1800; arrivedAt = performance.now();
  const s = depth(pos.y); bub.textContent = say;
  const side = -1;   /* Penny's bubble always opens to her LEFT: Gerry stands on her right */ bub.classList.toggle('flip', side < 0);   /* the bubble opens on the side away from Gerry */
  bub.style.left = vx(pos.x) + side * 120 * s + 'px'; bub.style.top = pos.y - 250 * s + 'px'; bub.classList.add('on');
  fixBub();
  talk(say);
}
/* Penny's bubble opens to her left. If that would run off the screen (the book stand, at the left edge), it sits above
   the two of them instead. Worked out from the bubble's own width, so it is right from the first moment. */
function fixBub() {
  const s = depth(pos.y), w = bub.offsetWidth, leftEdge = (pos.x - 120 * s - w) * FIT.s + FIT.left;
  bub.classList.remove('up');
  if (leftEdge < 12) { bub.classList.remove('flip'); bub.classList.add('up'); bub.style.left = (14 - FIT.left) / FIT.s + 'px'; bub.style.top = pos.y - 455 * s + 'px'; }   // against the left edge, just above her head, tail pointing down to her
}
let talkT = 0, talkN = 0;
function talk(text) {   // Penny says a line: recorded clip (kit/voice.js), her mouth moves until it ends
  clearTimeout(talkT); talking = true; const mine = ++talkN;
  const end = () => { if (mine === talkN) talking = false; };
  talkT = setTimeout(end, 900 + text.length * 90);                    // also ends if the sound is off or blocked
  return Voice.say(text, { who: 'penny' }).then(() => { if (sound) end(); });
}
function hush() { bub.classList.remove('on'); light(null); clearTimeout(talkT); talking = false; talkN++; }
function light(k) {
  document.querySelectorAll('.spot').forEach(e => e.classList.toggle('on', e.dataset.k === k));
  document.querySelectorAll('[data-s]').forEach(e => e.classList.toggle('on', e.dataset.s === k));
}
/* blink now and then */

/* computer: hover walks; click goes in. Tablet/phone: first tap walks, second tap goes in. */
let hoverT = 0, touch = false;
addEventListener('touchstart', () => { touch = true; }, { passive: true, once: true });
document.querySelectorAll('.spot').forEach(el => {
  const k = el.dataset.k;
  el.addEventListener('mouseenter', () => { if (touch) return; clearTimeout(hoverT); hoverT = setTimeout(() => walkTo(k), 120); });
  el.addEventListener('mouseleave', () => clearTimeout(hoverT));
  el.addEventListener('click', () => { if (at === k && !target) goIn(k); else { walkTo(k); if (!touch) waitThen(k, goIn); } });
});
function waitThen(k, fn) { const t = setInterval(() => { if (at === k && !target) { clearInterval(t); setTimeout(() => fn(k), 500); } }, 60); }
/* the three programmes are not live yet: their doors open to an Opening soon screen (the door links go here when a programme goes live) */
const SOON = { pbl: 'Start PBL opens in January! See you soon!', lgr: "Let's Go Readers opens in January! See you soon!", fm: 'Fresh Math opens in January! See you soon!' };
const LIVE = { pbl: '../play.html?v=mwu7ccx5&u=pbl/index.html', lgr: '../play.html?v=mwu7ccx5&u=lgr/kingdom.html', fm: '../play.html?v=mwu7ccx5&u=fm/index.html' };   // put a programme's address here to make its door open it
function goIn(k) {
  if (LIVE[k]) { hush(); P.classList.add('gone'); setTimeout(() => { location.href = LIVE[k]; }, 600); return; }
  const ins = document.getElementById('inside'), r = document.querySelector(`.spot[data-k="${k}"]`);
  const off = 0;
  ins.style.setProperty('--x', FIT.ox + (off + parseInt(r.style.left) + parseInt(r.style.width) / 2) * FIT.s + 'px');
  ins.style.setProperty('--y', FIT.top + (parseInt(r.style.top) + parseInt(r.style.height) * .7) * FIT.s + 'px');
  ins.style.setProperty('--k', Math.max(.4, Math.min(1.2, Turn.W / 1536, Turn.H / 1024)));
  const im = document.getElementById('inImg'); im.hidden = !PLACES[k].logo; if (PLACES[k].logo) im.src = PLACES[k].logo;
  document.getElementById('inTxt').innerHTML = k === 'books' ? 'Book 1 · pick a book!' : k === 'hall' ? 'My Hall of Fame' : 'Opening soon!<small>2027년 1월 OPEN</small>';
  if (SOON[k]) setTimeout(() => { if (ins.classList.contains('on')) Voice.say(SOON[k], { who: 'penny' }); }, 900);
  document.getElementById('shelf').hidden = k !== 'books';
  hush(); P.classList.add('gone');
  setTimeout(() => ins.classList.add('on'), 380);
  if (k === 'hall') setTimeout(() => { location.href = 'hall.html'; }, 1000);   // the hall's door opens into the room
}
document.querySelectorAll('.bk.soon').forEach(b => b.onclick = () => { b.classList.remove('wob'); void b.offsetWidth; b.classList.add('wob'); talk('Coming soon!'); });
document.getElementById('toHall').onclick = () => walkTo('hall');
document.getElementById('toStreet').onclick = () => walkTo('home');
document.getElementById('back').onclick = () => { document.getElementById('inside').classList.remove('on'); setTimeout(() => { P.classList.remove('gone'); arrive(at); }, 500); };
document.getElementById('snd').onclick = e => { sound = !sound; e.currentTarget.classList.toggle('off', !sound); Voice.mute(!sound); };
/* coming back from inside the Hall of Fame starts at its door once; the marker is then taken out of the address,
   so refreshing the page starts on the street again */
const fromHall = /scene=hall/.test(location.hash); if (fromHall) try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
if (fromHall) { pan(1); fit(); pos = { x: PLACES.hall.x, y: PLACES.hall.y }; place(); at = 'hall'; setTimeout(() => arrive('hall'), 200); }   // for checking pictures
if (/walk=hall/.test(location.hash)) setTimeout(() => document.getElementById('toHall').click(), 1500);   // for checking pictures
if (/open=books/.test(location.hash)) setTimeout(() => goIn('books'), 100);
/* checking stills: street.html#pose=walk-0.14 freezes the walk at that moment (seconds); #pose=stand, #pose=cheer */
const pose = (location.hash.match(/pose=([a-z0-9]+)(?:-([0-9.]+))?/) || []);
if (pose[1]) { pos = { x: 760, y: 900 }; place(); if (POSES[pose[1]]) { setPose(pose[1]); poseNow = 'frozen'; setPose = () => {}; }
  img.style.animation = 'none';
} else
/* opening: Penny walks in from the corner */
if (!fromHall && !/scene=/.test(location.hash)) { pos = { x: 1620, y: 793 }; place(); P.classList.add('left'); setTimeout(() => walkTo('home'), 300);   /* she walks in along the garden path */ }
</script>
