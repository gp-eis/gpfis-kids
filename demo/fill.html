<title>GPFIS · demo child</title>
<style>
@font-face { font-family: Fredoka; src: url(../ext/fonts/Fredoka.ttf); }
html, body { margin: 0; height: 100%; background: #8fcff5; font-family: Fredoka, 'Malgun Gothic', sans-serif; color: #3c2a15; }
main { min-height: 100%; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
.card { background: #fff7e6; border: 8px solid #fff; border-radius: 36px; box-shadow: 0 10px 0 #d9b98a; padding: 30px 36px; max-width: 620px; text-align: center; }
h1 { margin: 0 0 6px; font-size: 34px; } p { margin: 6px 0 18px; font-size: 19px; line-height: 1.45; color: #6b4d28; word-break: keep-all; }
button { font: 700 24px Fredoka, sans-serif; border: 0; border-radius: 22px; padding: 16px 26px; margin: 6px; color: #fff; cursor: pointer; }
#fill { background: #35b24a; box-shadow: 0 6px 0 #23863a; } #clear { background: #ff6b5e; box-shadow: 0 6px 0 #c4443a; } #go { background: #ffb52e; box-shadow: 0 6px 0 #c98512; }
button:active { transform: translateY(4px); box-shadow: none; }
body.auto .card > *:not(#wait) { display: none; } #wait { display: none; font-size: 30px; font-weight: 700; } body.auto #wait { display: block; }
#wait i { display: inline-block; width: 16px; height: 16px; margin: 0 5px; border-radius: 50%; background: #ffb52e; animation: dot 1s ease-in-out infinite; } #wait i:nth-child(2) { animation-delay: .15s; } #wait i:nth-child(3) { animation-delay: .3s; } @keyframes dot { 50% { transform: translateY(-12px); } }
#log { margin-top: 14px; font-size: 16px; color: #6b4d28; min-height: 22px; white-space: pre-line; }
</style>
<main><div class="card">
  <h1>GPFIS demo child</h1>
  <p>1주차를 모두 끝낸 아이의 기록을 이 기기에 채웁니다.<br>Fills this device with a child who has finished week 1 in all three programmes.</p>
  <button id="fill">Fill week 1 · 채우기</button><button id="clear">Clear · 지우기</button><br><button id="go">Story Street →</button>
  <div id="log"></div>
  <div id="wait"><i></i><i></i><i></i></div>
</div></main>

<script>
const log = document.getElementById('log'), say = t => { log.textContent += t + '\n'; }, NAME = { pbl: 'Start PBL', lgr: "Let's Go Readers", fm: 'Fresh Math' };
/* which demo this is: the upload's stamp (the live build adds ?v=... to the filler scripts). A device filled by an OLDER upload is
   filled again by the quiet entrance, so the sample always shows the newest demo (red missed words, new book pages ...). */
const DEMO_V = ((document.querySelector('script[src*="demo-fill"]') || {}).src || '').replace(/^.*[?&]v=([^&#]+).*$|^.*$/, '$1') || '1';
const dayKey = n => GPTrack.dayKey(new Date(Date.now() - n * 864e5));
async function clearAll() { log.textContent = ''; for (const g of GPTrack.PROGS) { try { if (GPDemoClear[g]) { await GPDemoClear[g](); say(NAME[g] + ': cleared'); } else say(NAME[g] + ': no clearer yet'); } catch (e) { say(NAME[g] + ': could not clear (' + e.message + ')'); } }
  GPTrack.reset(); try { localStorage.removeItem('gpfis.demo'); } catch (e) {} }
async function fillAll() { await clearAll(); log.textContent = '';
  for (const g of GPTrack.PROGS) { try { if (GPDemoFill[g]) { await GPDemoFill[g](); say(NAME[g] + ': week 1 filled'); } else say(NAME[g] + ': no filler yet'); } catch (e) { say(NAME[g] + ': could not fill (' + e.message + ')'); } }
  GPTrack.sync();   // what the programmes just saved becomes the board's "finished" marks
  /* the child came on four days this week: openings and a few extra plays, so the reports show days and "x times" */
  const L = JSON.parse(localStorage.getItem('gpfis.log') || '{"v":1,"days":{}}');
  [3, 2, 1, 0].forEach((n, i) => { const d = L.days[dayKey(n)] = L.days[dayKey(n)] || {}; for (const g of GPTrack.PROGS) { if ((i + GPTrack.PROGS.indexOf(g)) % 4 === 3) continue; const S = d[g] = d[g] || { o: 0, a: {} }; S.o += 1; } });
  /* each activity was also played once on an earlier day (with its week), so every report shows several days, not one */
  const seen = {}; for (const k in L.days) for (const g in L.days[k]) for (const n in (L.days[k][g].a || {})) (seen[g] = seen[g] || {})[n] = L.days[k][g].a[n].w || 1;
  /* names a programme counts only for its own report (Fresh Math's page-by-page plays, the books being opened) */
  const EXTRA = { fm: ['w1video', 'w1p1', 'w1p2', 'w1p3', 'w1p4', 'w1p5', 'w1p6', 'w1p7', 'w1p8', 'w1book'], lgr: ['book'] };
  for (const g in EXTRA) if (seen[g]) for (const n of EXTRA[g]) seen[g][n] = seen[g][n] || 1;
  for (const g in seen) Object.keys(seen[g]).forEach((n, j) => { const back = 1 + j % 3, d = L.days[dayKey(back)] = L.days[dayKey(back)] || {}, S = d[g] = d[g] || { o: 1, a: {} }, a = S.a[n] = S.a[n] || { p: 0, d: 0, s: 0 }; a.p += 1; a.w = seen[g][n]; });
  const t = L.days[dayKey(0)] || {}; for (const g in t) for (const n in t[g].a) { const a = t[g].a[n]; a.p = Math.max(a.p, a.d) + (n.length % 3 === 0 ? 1 : 0); }
  localStorage.setItem('gpfis.log', JSON.stringify(L)); localStorage.setItem('gpfis.demo', DEMO_V); say('Done.'); }
const street = () => { location.href = 'street.html'; };
document.getElementById('fill').onclick = fillAll; document.getElementById('clear').onclick = clearAll; document.getElementById('go').onclick = street;
const Q = new URLSearchParams(location.search), go = Q.get('go'); if (go === 'fill') fillAll().then(street); if (go === 'clear') clearAll().then(street);
/* go=sample (the GPEIS platform's 맛보기 buttons, for now: user 24 Nov, "we'll have to revert back when i tell you so"):
   a quiet entrance. Fills week 1 only if this device does not hold the demo child yet, then goes on to the page asked for
   (to= a path inside this site, e.g. pbl/index.html; default Story Street). No buttons are shown. */
if (go === 'sample') { document.body.classList.add('auto'); const to = Q.get('to') || '', safe = /^[a-z0-9][a-z0-9_.\/-]*[.]html$/i.test(to) && !to.includes('..') && !to.includes('//');
  const on = () => { location.replace(safe ? '../' + to : 'street.html'); };
  let has = false; try { has = localStorage.getItem('gpfis.demo') === DEMO_V; } catch (e) {}
  if (has) on(); else Promise.race([fillAll(), new Promise(r => setTimeout(r, 25000))]).then(on, on); }
window.GPDemo = { fillAll, clearAll };
</script>
